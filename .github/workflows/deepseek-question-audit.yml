name: Repair all question classifications

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Questões analisadas por chamada'
        required: true
        default: '8'
        type: string
      concurrency:
        description: 'Chamadas simultâneas'
        required: true
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: deepseek-question-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEEPSEEK_API_KEY: ${{ secrets.eduflow }}
      DEEPSEEK_MODEL: deepseek-v4.1-flash
      DEEPSEEK_AUDIT_BATCH_SIZE: ${{ inputs.batch_size }}
      DEEPSEEK_AUDIT_CONCURRENCY: ${{ inputs.concurrency }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QUESTION_AUDIT_SOURCE: artifacts/questions-for-review.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export the current production database
        run: npm run questions:export
      - name: Restore DeepSeek audit checkpoint
        uses: actions/cache/restore@v4
        with:
          path: artifacts/deepseek-question-audit.checkpoint.json
          key: deepseek-question-audit-${{ github.run_id }}-deepseek-v4.1-flash
          restore-keys: |
            deepseek-question-audit-
      - name: Analyze every question with DeepSeek V4
        run: npm run questions:audit-all
      - name: Save checkpoint for a retry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/deepseek-question-audit.checkpoint.json
          key: deepseek-question-audit-${{ hashFiles('data/review/questions.csv') }}-deepseek-v4.1-flash-${{ github.run_id }}
      - name: Upload complete AI audit and applicable corrections
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-v4-question-audit
          path: |
            artifacts/deepseek-question-audit.json
            artifacts/deepseek-question-classification-corrections.json
            artifacts/questions-for-review.csv
          if-no-files-found: error
          retention-days: 30
      - name: Validate AI corrections against the current database
        run: npm run questions:apply-review -- --file=artifacts/deepseek-question-classification-corrections.json --source=artifacts/questions-for-review.csv
      - name: Apply all AI-reviewed corrections
        env:
          CONFIRM_QUESTION_REVIEW: APPLY
        run: npm run questions:apply-review -- --apply --file=artifacts/deepseek-question-classification-corrections.json --source=artifacts/questions-for-review.csv
      - name: Export and retain the repaired database
        run: npm run questions:export
