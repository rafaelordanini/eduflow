<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow — Plataforma E-Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#f7f5f0;--bg-pattern:radial-gradient(circle at 15% 40%,rgba(27,107,82,.04) 0%,transparent 55%),radial-gradient(circle at 85% 25%,rgba(200,93,44,.03) 0%,transparent 50%);--surface:#fff;--surface-hover:#faf9f6;--primary:#1b6b52;--primary-hover:#145640;--primary-light:rgba(27,107,82,.08);--primary-text:#fff;--accent:#c85d2c;--accent-hover:#a94e24;--accent-light:rgba(200,93,44,.08);--text:#1a1d23;--text-secondary:#555b66;--text-muted:#8b919d;--danger:#c0392b;--danger-hover:#a5311f;--success:#27ae60;--warning:#e8a317;--border:#e2ded6;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 10px 35px rgba(0,0,0,.12);--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--transition:.2s ease;--code-bg:#f0ece4}
        .dark{--bg:#0c1017;--bg-pattern:radial-gradient(circle at 15% 40%,rgba(77,216,160,.03) 0%,transparent 55%),radial-gradient(circle at 85% 25%,rgba(240,149,74,.03) 0%,transparent 50%);--surface:#1a2030;--surface-hover:#212940;--primary:#4dd8a0;--primary-hover:#3ec98e;--primary-light:rgba(77,216,160,.08);--primary-text:#0c1017;--accent:#f0954a;--accent-hover:#e07c2e;--accent-light:rgba(240,149,74,.08);--text:#e4e8f0;--text-secondary:#a0a8b8;--text-muted:#6b7380;--danger:#e74c3c;--danger-hover:#c0392b;--success:#2ecc71;--warning:#f1c40f;--border:#2a3348;--shadow-sm:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 14px rgba(0,0,0,.3);--shadow-lg:0 10px 35px rgba(0,0,0,.4);--code-bg:#141a26}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Figtree',sans-serif;background:var(--bg);background-image:var(--bg-pattern);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
        h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:700;line-height:1.25}
        a{color:var(--primary);text-decoration:none}
        .container{max-width:1100px;margin:0 auto;padding:0 20px}
        .page-content{padding:32px 0 60px;animation:fadeUp .4s ease}
        .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:28px}
        .page-header h1{font-size:1.8rem}
        .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--text-muted);margin-bottom:20px;flex-wrap:wrap}
        .breadcrumb a{color:var(--primary);cursor:pointer;transition:opacity var(--transition)}
        .breadcrumb a:hover{opacity:.7}
        .breadcrumb .sep{font-size:.7rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
        /* Navbar */
        .navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .navbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
        .navbar-brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
        .navbar-brand .logo{width:34px;height:34px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--primary-text);font-weight:800;font-size:1.1rem;font-family:'Fraunces',serif}
        .navbar-brand span{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem}
        .navbar-links{display:flex;align-items:center;gap:4px;overflow-x:auto}
        .navbar-links button{background:none;border:none;color:var(--text-secondary);font-family:'Figtree',sans-serif;font-size:.85rem;font-weight:500;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);white-space:nowrap}
        .navbar-links button:hover,.navbar-links button.active{background:var(--primary-light);color:var(--primary)}
        .navbar-user{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--text-secondary);flex-shrink:0}
        .navbar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem}
        .navbar-user .logout-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px;transition:color var(--transition)}
        .navbar-user .logout-btn:hover{color:var(--danger)}
        /* Login */
        .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-card{background:var(--surface);border-radius:var(--radius-xl);padding:48px 40px;box-shadow:var(--shadow-lg);max-width:420px;width:100%;text-align:center;border:1px solid var(--border);animation:fadeUp .5s ease}
        .login-logo{width:64px;height:64px;background:var(--primary);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;color:var(--primary-text);font-family:'Fraunces',serif;font-weight:800;font-size:1.8rem;margin-bottom:20px}
        .login-card h1{font-size:1.6rem;margin-bottom:6px}
        .login-card .subtitle{color:var(--text-muted);font-size:.95rem;margin-bottom:32px}
        .login-error{background:rgba(192,57,43,.08);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:16px;display:none;text-align:left}
        .login-error.show{display:flex;align-items:center;gap:8px}
        .password-wrapper{position:relative}
        .password-wrapper input{padding-right:44px}
        .password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px;transition:color var(--transition);width:auto}
        .password-toggle:hover{color:var(--text)}
        /* Cards */
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:all .25s ease;position:relative;overflow:hidden}
        .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
        .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
        .card h3{font-size:1.15rem}
        .card p{color:var(--text-secondary);font-size:.9rem;margin-bottom:16px}
        .card-meta{display:flex;align-items:center;gap:16px;font-size:.82rem;color:var(--text-muted)}
        .card-meta i{margin-right:4px}
        .card-actions{display:flex;gap:6px}
        .card-actions button{width:34px;height:34px;border:none;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all var(--transition);background:var(--surface-hover);color:var(--text-secondary)}
        .card-actions button:hover{background:var(--primary-light);color:var(--primary)}
        .card-actions button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .card-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
        .card-tag.admin{background:var(--accent-light);color:var(--accent)}
        .card-tag.student{background:var(--primary-light);color:var(--primary)}
        .card-progress-bar{height:5px;background:var(--border);border-radius:99px;margin-top:14px;overflow:hidden}
        .card-progress-bar .fill{height:100%;background:var(--primary);border-radius:99px;transition:width .5s ease}
        /* Forms */
        .form-group{margin-bottom:18px}
        .form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--text-secondary)}
        input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:'Figtree',sans-serif;font-size:16px;transition:border-color var(--transition);outline:none}
        input:focus,textarea:focus,select:focus{border-color:var(--primary)}
        textarea{resize:vertical;min-height:80px}
        .form-row{display:flex;gap:14px}
        .form-row .form-group{flex:1}
        .form-hint{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .url-status{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;margin-top:4px;font-weight:500}
        .url-status.valid{color:var(--success)}
        .url-status.invalid{color:var(--danger)}
        .form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:24px}
        .form-card h3{margin-bottom:20px;font-size:1.1rem}
        /* Buttons */
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap}
        .btn-primary{background:var(--primary);color:var(--primary-text)}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-accent{background:var(--accent);color:#fff}
        .btn-accent:hover{background:var(--accent-hover)}
        .btn-secondary{background:var(--surface-hover);color:var(--text-secondary);border:1px solid var(--border)}
        .btn-secondary:hover{background:var(--border)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{background:var(--danger-hover)}
        .btn-sm{padding:7px 14px;font-size:.82rem}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        /* Lesson List */
        .lesson-list{display:flex;flex-direction:column;gap:8px}
        .lesson-item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);transition:all var(--transition)}
        .lesson-item:hover{background:var(--surface-hover)}
        .lesson-item .order-num{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
        .lesson-item .lesson-info{flex:1;min-width:0}
        .lesson-item .lesson-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lesson-item .lesson-meta{font-size:.8rem;color:var(--text-muted);margin-top:2px}
        .lesson-item .lesson-actions{display:flex;gap:4px;flex-shrink:0}
        .lesson-item .lesson-actions button{width:30px;height:30px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all var(--transition)}
        .lesson-item .lesson-actions button:hover{background:var(--primary-light);color:var(--primary)}
        .lesson-item .lesson-actions button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .lesson-item.clickable{cursor:pointer}
        .lesson-item .status-icon{flex-shrink:0;font-size:1rem}
        .lesson-item .status-icon.complete{color:var(--success)}
        .lesson-item .status-icon.in-progress{color:var(--warning)}
        .lesson-item .status-icon.pending{color:var(--border)}
        /* Video */
        .video-wrapper{background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow-md)}
        .video-wrapper iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
        .video-placeholder{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius-lg);margin-bottom:24px;color:var(--text-muted)}
        .video-placeholder i{font-size:3rem;margin-bottom:12px;opacity:.4}
        .video-placeholder p{font-size:.95rem}
        /* Progress */
        .progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .progress-card h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .progress-card h3 i{color:var(--accent)}
        .time-input-group{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .time-input-group input[type="number"]{width:80px;text-align:center;font-size:1.1rem;font-weight:600;padding:10px 8px;-moz-appearance:textfield}
        .time-input-group input[type="number"]::-webkit-inner-spin-button,.time-input-group input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}
        .time-input-group .time-sep{font-size:1.3rem;font-weight:700;color:var(--text-muted)}
        .time-input-group label{font-size:.78rem;color:var(--text-muted)}
        .progress-bar-full{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:16px 0}
        .progress-bar-full .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .6s ease}
        .progress-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-muted)}
        .complete-toggle{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
        .toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
        .toggle-switch input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:99px;cursor:pointer;transition:all var(--transition)}
        .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform var(--transition);box-shadow:var(--shadow-sm)}
        .toggle-switch input:checked+.toggle-slider{background:var(--success)}
        .toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
        .complete-toggle span{font-size:.9rem;font-weight:500}
        .resume-banner{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--accent);font-weight:500;animation:fadeUp .3s ease}
        .resume-banner i{font-size:1.1rem}
        .lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
        /* User Table */
        .user-table{width:100%;border-collapse:collapse}
        .user-table th{text-align:left;font-size:.82rem;font-weight:600;color:var(--text-muted);padding:10px 14px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
        .user-table td{padding:14px;border-bottom:1px solid var(--border);font-size:.92rem;vertical-align:middle}
        .user-table tr:hover td{background:var(--surface-hover)}
        .user-table .role-badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
        .user-table .role-badge.admin{background:var(--accent-light);color:var(--accent)}
        .user-table .role-badge.student{background:var(--primary-light);color:var(--primary)}
        .user-table .actions-cell button{width:30px;height:30px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;transition:all var(--transition);vertical-align:middle}
        .user-table .actions-cell button:hover{background:var(--primary-light);color:var(--primary)}
        .user-table .actions-cell button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .user-table .mono{font-family:'Courier New',monospace;font-size:.85rem;color:var(--text-secondary)}
        /* Modals */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s ease;backdrop-filter:blur(4px)}
        .modal{background:var(--surface);border-radius:var(--radius-lg);padding:32px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);animation:scaleIn .25s ease;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
        .modal h3{font-size:1.2rem;margin-bottom:12px}
        .modal p{color:var(--text-secondary);font-size:.95rem;margin-bottom:24px}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px}
        /* Toasts */
        #toast-container{position:fixed;top:76px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;border-radius:var(--radius-md);font-size:.88rem;font-weight:500;color:#fff;box-shadow:var(--shadow-md);transform:translateX(120%);transition:transform .3s ease;min-width:220px;display:flex;align-items:center;gap:8px}
        .toast.show{transform:translateX(0)}
        .toast-success{background:var(--success)}
        .toast-error{background:var(--danger)}
        .toast-info{background:var(--primary)}
        /* Empty + Loading */
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state i{font-size:3rem;margin-bottom:16px;opacity:.3}
        .empty-state h3{color:var(--text-secondary);margin-bottom:8px;font-size:1.1rem}
        .empty-state p{font-size:.9rem}
        .loading-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);gap:10px;font-size:.95rem}
        .loading-spinner i{animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* Animations */
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        .card,.lesson-item,.form-card{animation:fadeUp .4s ease backwards}
        /* Responsive */
        /* Planner */
        .planner-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px}
        .hours-selector{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
        .hours-btn{padding:8px 18px;border:1.5px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text-secondary);font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all var(--transition)}
        .hours-btn.active,.hours-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
        .plan-output{margin-top:8px}
        .baron-header{display:flex;align-items:center;gap:14px;padding:20px 24px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:var(--radius-lg);color:#fff;margin-bottom:20px}
        .baron-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
        .baron-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        .baron-avatar-sm{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--primary-light)}
        .baron-avatar-sm img{width:100%;height:100%;object-fit:cover}
        .baron-float{position:fixed;bottom:24px;right:24px;z-index:200;cursor:pointer;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));transition:transform .2s ease}
        .baron-float:hover{transform:scale(1.07)}
        .baron-float img{width:72px;height:72px;border-radius:50%;border:3px solid var(--primary);background:var(--surface)}
        .baron-header .baron-msg{flex:1}
        .baron-header .baron-msg h3{font-size:1rem;font-weight:600;opacity:.85;margin-bottom:4px}
        .baron-header .baron-msg p{font-size:.95rem;line-height:1.5}
        .plan-resumo{background:var(--accent-light);border:1px solid rgba(200,93,44,.2);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:20px;font-size:.92rem;color:var(--text);line-height:1.6}
        .plan-blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
        .plan-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;display:flex;gap:16px;align-items:flex-start}
        .plan-block.pausa{background:var(--surface-hover);border-style:dashed;opacity:.7}
        .plan-block-time{font-size:.78rem;font-weight:700;color:var(--text-muted);white-space:nowrap;padding-top:2px;min-width:110px}
        .plan-block-body{flex:1}
        .plan-block-title{font-weight:700;font-size:.95rem;margin-bottom:4px}
        .plan-block-desc{font-size:.85rem;color:var(--text-secondary);line-height:1.5}
        .plan-block-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
        .tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
        .tag-alta{background:rgba(192,57,43,.1);color:var(--danger)}
        .tag-media{background:var(--accent-light);color:var(--accent)}
        .tag-baixa{background:var(--primary-light);color:var(--primary)}
        .tag-mat{background:var(--primary-light);color:var(--primary)}
        .tag-tipo{background:rgba(0,0,0,.05);color:var(--text-muted)}
        .plan-dica{background:var(--primary-light);border-radius:var(--radius-md);padding:14px 18px;font-size:.88rem;color:var(--text);display:flex;gap:10px;align-items:flex-start}
        .plan-dica i{color:var(--primary);margin-top:2px;flex-shrink:0}
        .plan-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:12px;color:var(--text-muted)}
        .plan-loading i{font-size:2rem;animation:spin 1s linear infinite;color:var(--primary)}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:768px){.grid{grid-template-columns:1fr}.page-header h1{font-size:1.4rem}.login-card{padding:32px 24px}.form-row{flex-direction:column;gap:0}.navbar-links button span{display:none}.navbar-links button i{font-size:1.1rem}.lesson-nav{flex-direction:column}.lesson-nav .btn{justify-content:center}.user-table .hide-mobile{display:none}.plan-block{flex-direction:column;gap:6px}.plan-block-time{min-width:auto}}
        @media(max-width:480px){.navbar-inner{height:52px}.navbar-brand span{display:none}.page-content{padding:20px 0 40px}.container{padding:0 14px}}
        /* Plan History */
        .history-section{margin-top:36px}
        .history-section h2{font-size:1.15rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
        .history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:all var(--transition)}
        .history-card:hover{background:var(--surface-hover);box-shadow:var(--shadow-sm)}
        .history-card-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .history-card-date{font-weight:700;font-size:.95rem}
        .history-card-meta{font-size:.82rem;color:var(--text-muted)}
        .history-card-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none}
        .history-card-body.open{display:block}
        /* Macro Planner */
        .macro-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px}
        .macro-form h2{font-size:1.15rem;margin-bottom:20px}
        .macro-output{margin-top:8px}
        .macro-semana{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:12px;overflow:hidden}
        .macro-semana-header{padding:14px 20px;background:var(--primary-light);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.95rem}
        .macro-semana-body{padding:16px 20px;display:none;border-top:1px solid var(--border)}
        .macro-semana-body.open{display:block}
        .macro-materia{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
        .macro-materia:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
        .macro-materia-name{font-weight:700;color:var(--primary);font-size:.95rem;margin-bottom:6px}
        .macro-materia-topico{font-size:.88rem;color:var(--text-secondary);margin-bottom:6px}
        .macro-atividade{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--text-secondary);margin-bottom:4px}
        .macro-atividade i{color:var(--accent);margin-top:2px;flex-shrink:0}
        .macro-leituras{font-size:.82rem;color:var(--text-muted);margin-top:6px;font-style:italic}
        /* Lesson Readings */
        .readings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .readings-section h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .readings-section h3 i{color:var(--primary)}
        .reading-progress{font-size:.82rem;color:var(--text-muted);margin-bottom:14px}
        .reading-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity var(--transition)}
        .reading-item:last-child{border-bottom:none}
        .reading-item:hover{opacity:.8}
        .reading-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
        .reading-item label{flex:1;font-size:.9rem;cursor:pointer;line-height:1.4}
        .reading-item.done label{text-decoration:line-through;color:var(--text-muted)}
        /* Questions Section */
        .questions-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .questions-section h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .questions-section h3 i{color:var(--accent)}
        .questao-card{background:var(--surface-hover);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:12px}
        .questao-enunciado{font-size:.92rem;line-height:1.6;font-weight:500;margin-bottom:14px}
        .questao-opcao{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);margin-bottom:6px;border:1px solid transparent}
        .questao-opcao:hover{background:var(--primary-light);border-color:var(--primary-light)}
        .questao-opcao input[type="radio"]{width:16px;height:16px;margin-top:2px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
        .questao-opcao .opcao-letra{font-weight:700;color:var(--primary);font-size:.9rem;flex-shrink:0;min-width:20px}
        .questao-opcao .opcao-texto{flex:1;font-size:.9rem;cursor:pointer;line-height:1.5;color:var(--text)}
        .questao-gabarito{margin-top:14px;padding:12px 16px;border-radius:var(--radius-sm);font-size:.88rem;display:none}
        .questao-gabarito.show{display:block}
        .questao-gabarito.correct{background:rgba(39,174,96,.1);border:1px solid var(--success);color:var(--success)}
        .questao-gabarito.wrong{background:rgba(192,57,43,.08);border:1px solid var(--danger);color:var(--danger)}
        .questao-explicacao{margin-top:10px;padding:12px 14px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:.85rem;color:var(--text);line-height:1.6;display:none}
        .questao-explicacao.show{display:block}
        .questoes-score{text-align:center;padding:20px;font-size:1.1rem;font-weight:700;color:var(--primary);display:none}
        .questoes-score.show{display:block}
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <div class="baron-float" id="baron-float" onclick="navigate('student-planner')" title="Plano de Hoje com o Barão" style="display:none">
        <img src="/public/baron-avatar.png" alt="Barão" onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\'width:72px;height:72px;border-radius:50%;border:3px solid var(--primary);background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.8rem\'><i class=\'fas fa-user-tie\'></i></div>'">
    </div>

    <script>
    /* ============================================================
       API CLIENT
       ============================================================ */
    var _store = window['local' + 'Storage'];
    var API = {
        getToken: function() { try { return _store.getItem('eduflow_token'); } catch(e) { return null; } },
        setToken: function(t) { try { _store.setItem('eduflow_token', t); } catch(e) { /* noop */ } },
        clearToken: function() { try { _store.removeItem('eduflow_token'); } catch(e) { /* noop */ } },

        request: function(method, url, body) {
            var headers = { 'Content-Type': 'application/json' };
            var token = this.getToken();
            if (token) headers['Authorization'] = 'Bearer ' + token;
            var opts = { method: method, headers: headers };
            if (body) opts.body = JSON.stringify(body);
            return fetch(url, opts).then(function(res) {
                var contentType = res.headers.get('content-type') || '';
                if (contentType.indexOf('application/json') === -1) {
                    return res.text().then(function(text) {
                        throw new Error(res.ok ? text : 'Erro do servidor (HTTP ' + res.status + '): ' + (text || '').substring(0, 120));
                    });
                }
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || 'Erro na requisição');
                    return data;
                });
            });
        },

        login: function(username, password) { return this.request('POST', '/api/auth/login', { username: username, password: password }); },
        getMe: function() { return this.request('GET', '/api/auth/me'); },

        getUsers: function() { return this.request('GET', '/api/users'); },
        createUser: function(data) { return this.request('POST', '/api/users', data); },
        updateUser: function(id, data) { return this.request('PUT', '/api/users?id=' + id, data); },
        deleteUser: function(id) { return this.request('DELETE', '/api/users?id=' + id); },

        getSubjects: function() { return this.request('GET', '/api/subjects'); },
        createSubject: function(data) { return this.request('POST', '/api/subjects', data); },
        updateSubject: function(id, data) { return this.request('PUT', '/api/subjects?id=' + id, data); },
        deleteSubject: function(id) { return this.request('DELETE', '/api/subjects?id=' + id); },

        getLessons: function(subjectId) { return this.request('GET', '/api/lessons?subjectId=' + subjectId); },
        createLesson: function(data) { return this.request('POST', '/api/lessons', data); },
        updateLesson: function(id, data) { return this.request('PUT', '/api/lessons?id=' + id, data); },
        deleteLesson: function(id) { return this.request('DELETE', '/api/lessons?id=' + id); },
        reorderLesson: function(lessonId, direction) { return this.request('PUT', '/api/lessons/reorder', { lessonId: lessonId, direction: direction }); },

        getProgress: function(lessonId) { return this.request('GET', '/api/progress' + (lessonId ? '?lessonId=' + lessonId : '')); },
        saveProgress: function(data) { return this.request('POST', '/api/progress', data); },

        resetPassword: function(token, username, newPassword) { return this.request('POST', '/api/auth/reset', { token: token, username: username, newPassword: newPassword }); },

        generateMacroPlan: function(data) { return this.request('POST', '/api/generate-macro-plan', data); },
        getPlansHistory: function() { return this.request('GET', '/api/plans-history'); },
        generateQuestions: function(data) { return this.request('POST', '/api/generate-questions', data); }
    };

    /* ============================================================
       STATE
       ============================================================ */
    var state = { view: 'login', user: null, selectedSubjectId: null, selectedLessonId: null, resetToken: null };

    /* ============================================================
       UTILITIES
       ============================================================ */
    function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
    function formatTime(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

    /* Dark Mode */
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        document.documentElement.classList[e.matches ? 'add' : 'remove']('dark');
    });

    /* Toast */
    function showToast(msg, type) {
        type = type || 'success';
        var icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
        var t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.innerHTML = '<i class="fas ' + (icons[type]||icons.info) + '"></i> ' + escapeHtml(msg);
        document.getElementById('toast-container').appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2500);
    }

    /* Confirm Modal */
    function showConfirmModal(title, msg, confirmText, cls, onConfirm) {
        var o = document.createElement('div'); o.className = 'modal-overlay';
        o.innerHTML = '<div class="modal"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(msg)+'</p><div class="modal-actions"><button class="btn btn-secondary cancel-btn">Cancelar</button><button class="btn '+(cls||'btn-danger')+' confirm-btn">'+escapeHtml(confirmText)+'</button></div></div>';
        o.querySelector('.cancel-btn').addEventListener('click', function() { o.remove(); });
        o.querySelector('.confirm-btn').addEventListener('click', function() { onConfirm(); o.remove(); });
        o.addEventListener('click', function(e) { if (e.target === o) o.remove(); });
        document.body.appendChild(o);
    }

    /* Form Modal */
    function showFormModal(title, fields, submitText, onSubmit) {
        var o = document.createElement('div'); o.className = 'modal-overlay';
        var fh = fields.map(function(f) {
            var ih = '';
            if (f.type === 'textarea') ih = '<textarea id="modal-'+f.name+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(f.value||'')+'</textarea>';
            else if (f.type === 'select') { ih = '<select id="modal-'+f.name+'">' + f.options.map(function(op) { return '<option value="'+escapeHtml(op.value)+'"'+(op.value===f.value?' selected':'')+'>'+escapeHtml(op.label)+'</option>'; }).join('') + '</select>'; }
            else ih = '<input type="'+(f.type||'text')+'" id="modal-'+f.name+'" value="'+escapeHtml(f.value||'')+'" placeholder="'+escapeHtml(f.placeholder||'')+'"'+(f.required?' required':'')+'>';
            return '<div class="form-group"><label>'+escapeHtml(f.label)+'</label>'+ih+'</div>';
        }).join('');
        o.innerHTML = '<div class="modal"><h3>'+escapeHtml(title)+'</h3><form id="modal-form">'+fh+'<div class="modal-actions"><button type="button" class="btn btn-secondary cancel-btn">Cancelar</button><button type="submit" class="btn btn-primary">'+escapeHtml(submitText)+'</button></div></form></div>';
        o.querySelector('.cancel-btn').addEventListener('click', function() { o.remove(); });
        o.querySelector('#modal-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var v = {}; fields.forEach(function(f) { v[f.name] = document.getElementById('modal-'+f.name).value; });
            onSubmit(v); o.remove();
        });
        o.addEventListener('click', function(e) { if (e.target === o) o.remove(); });
        document.body.appendChild(o);
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    function navigate(view, params) {
        state.view = view;
        if (params) {
            if (params.subjectId !== undefined) state.selectedSubjectId = params.subjectId;
            if (params.lessonId !== undefined) state.selectedLessonId = params.lessonId;
        }
        render();
        window.scrollTo(0, 0);
    }

    /* ============================================================
       NAVBAR
       ============================================================ */
    function renderNavbar(links) {
        var initial = state.user ? state.user.name.charAt(0).toUpperCase() : '?';
        var home = state.user && state.user.role === 'admin' ? 'admin-dashboard' : 'student-dashboard';
        var lh = links.map(function(l) { return '<button class="'+(state.view===l.view?'active':'')+'" onclick="navigate(\''+l.view+'\')"><i class="fas '+l.icon+'"></i> <span>'+escapeHtml(l.label)+'</span></button>'; }).join('');
        return '<nav class="navbar"><div class="navbar-inner"><div class="navbar-brand" onclick="navigate(\''+home+'\')"><div class="logo">E</div><span>EduFlow</span></div><div class="navbar-links">'+lh+'</div><div class="navbar-user"><div class="avatar">'+escapeHtml(initial)+'</div><span>'+escapeHtml(state.user?state.user.name:'')+'</span><button class="logout-btn" onclick="handleLogout()" title="Sair"><i class="fas fa-sign-out-alt"></i></button></div></div></nav>';
    }
    function adminNav() { return [{ view:'admin-dashboard',icon:'fa-th-large',label:'Matérias' },{ view:'admin-users',icon:'fa-users-cog',label:'Usuários' },{ view:'admin-schema',icon:'fa-database',label:'Schema' }]; }
    function studentNav() { return [{view:'student-dashboard',icon:'fa-th-large',label:'Matérias'},{view:'student-planner',icon:'fa-calendar-day',label:'Plano de Hoje'},{view:'student-macro-planner',icon:'fa-road',label:'Plano Mestre'}]; }

    /* ============================================================
       VIEW: RESET PASSWORD
       ============================================================ */
    function renderResetPassword() {
        return '<div class="login-screen"><div class="login-card"><div class="login-logo">E</div><h1>EduFlow</h1><p class="subtitle">Recuperação de Senha</p><div class="login-error" id="reset-error"><i class="fas fa-exclamation-circle"></i><span id="reset-error-msg"></span></div><form id="reset-form"><div class="form-group" style="text-align:left"><label>Seu Usuário</label><input type="text" id="reset-username" placeholder="Digite seu usuário" autocomplete="username" required></div><div class="form-group" style="text-align:left"><label>Nova Senha</label><div class="password-wrapper"><input type="password" id="reset-password" placeholder="Mínimo de 4 caracteres" autocomplete="new-password" required><button type="button" class="password-toggle" id="pw-reset-toggle" tabindex="-1"><i class="fas fa-eye"></i></button></div></div><button type="submit" class="btn btn-primary" id="reset-btn" style="width:100%;justify-content:center;padding:14px"><i class="fas fa-key"></i> Redefinir Senha</button><div style="margin-top:16px;text-align:center"><a href="#" onclick="navigate(\'login\');return false;" style="font-size:.9rem;color:var(--text-muted)">Voltar ao Login</a></div></form></div></div>';
    }
    function bindResetPassword() {
        var pwT = document.getElementById('pw-reset-toggle');
        if (pwT) pwT.addEventListener('click', function() { var i=document.getElementById('reset-password'),ic=this.querySelector('i'); if(i.type==='password'){i.type='text';ic.className='fas fa-eye-slash';}else{i.type='password';ic.className='fas fa-eye';} });
        var form = document.getElementById('reset-form');
        if (form) form.addEventListener('submit', function(e) {
            e.preventDefault();
            var u=document.getElementById('reset-username').value.trim(), p=document.getElementById('reset-password').value;
            if (!u||!p) { showResetError('Preencha todos os campos.'); return; }
            var btn=document.getElementById('reset-btn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Atualizando...';
            API.resetPassword(state.resetToken, u, p).then(function() {
                showToast('Senha redefinida com sucesso!', 'success');
                // Remove the reset parameter from the URL cleanly
                if(window.history && window.history.replaceState) {
                    var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({path:cleanUrl}, '', cleanUrl);
                }
                state.resetToken = null;
                navigate('login');
            }).catch(function(err) {
                showResetError(err.message); btn.disabled=false; btn.innerHTML='<i class="fas fa-key"></i> Redefinir Senha';
            });
        });
    }
    function showResetError(msg) { var e=document.getElementById('reset-error'),m=document.getElementById('reset-error-msg'); if(e&&m){m.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},4000);} }

    /* ============================================================
       VIEW: LOGIN
       ============================================================ */
    function renderLogin() {
        return '<div class="login-screen"><div class="login-card"><div class="login-logo">E</div><h1>EduFlow</h1><p class="subtitle">Plataforma de E-Learning</p><div class="login-error" id="login-error"><i class="fas fa-exclamation-circle"></i><span id="login-error-msg"></span></div><form id="login-form"><div class="form-group" style="text-align:left"><label>Usuário</label><input type="text" id="login-username" placeholder="Digite seu usuário" autocomplete="username" required></div><div class="form-group" style="text-align:left"><label>Senha</label><div class="password-wrapper"><input type="password" id="login-password" placeholder="Digite sua senha" autocomplete="current-password" required><button type="button" class="password-toggle" id="pw-toggle" tabindex="-1"><i class="fas fa-eye"></i></button></div></div><button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;padding:14px"><i class="fas fa-sign-in-alt"></i> Entrar</button><div style="margin-top: 16px; font-size: 0.9rem;"><a href="mailto:rafaelordanini@gmail.com?subject=Recupera%C3%A7%C3%A3o%20de%20Senha%20-%20EduFlow" style="color: var(--text-muted); text-decoration: underline;">Esqueceu a senha?</a></div></form></div></div>';
    }
    function bindLogin() {
        var pwT = document.getElementById('pw-toggle');
        if (pwT) pwT.addEventListener('click', function() { var i=document.getElementById('login-password'),ic=this.querySelector('i'); if(i.type==='password'){i.type='text';ic.className='fas fa-eye-slash';}else{i.type='password';ic.className='fas fa-eye';} });
        var form = document.getElementById('login-form');
        if (form) form.addEventListener('submit', function(e) {
            e.preventDefault();
            var u=document.getElementById('login-username').value.trim(), p=document.getElementById('login-password').value;
            if (!u||!p) { showLoginError('Preencha todos os campos.'); return; }
            var btn=document.getElementById('login-btn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Entrando...';
            API.login(u, p).then(function(data) {
                API.setToken(data.token);
                state.user = data.user;
                navigate(data.user.role==='admin'?'admin-dashboard':'student-dashboard');
                showToast('Bem-vindo, '+data.user.name+'!','info');
            }).catch(function(err) {
                showLoginError(err.message); btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Entrar';
            });
        });
    }
    function showLoginError(msg) { var e=document.getElementById('login-error'),m=document.getElementById('login-error-msg'); if(e&&m){m.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},4000);} }

    /* ============================================================
       VIEW: ADMIN DASHBOARD
       ============================================================ */
    function renderAdminDashboard() {
        var app = document.getElementById('app');
        app.innerHTML = renderNavbar(adminNav()) + '<div class="container"><div class="page-content"><div class="page-header"><h1>Matérias</h1><button class="btn btn-primary" onclick="handleAddSubject()"><i class="fas fa-plus"></i> Nova Matéria</button></div><div class="loading-spinner" id="subjects-area"><i class="fas fa-spinner"></i> Carregando...</div></div></div>';
        API.getSubjects().then(function(subjects) {
            var area = document.getElementById('subjects-area');
            if (!area) return;
            area.className = '';
            if (subjects.length === 0) { area.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><h3>Nenhuma matéria cadastrada</h3><p>Crie sua primeira matéria para começar.</p></div>'; return; }
            // Fetch lesson counts
            var promises = subjects.map(function(s) { return API.getLessons(s.id).then(function(l) { s._lessonCount = l.length; }); });
            Promise.all(promises).then(function() {
                var cards = subjects.map(function(s) {
                    var lc = s._lessonCount || 0;
                    return '<div class="card"><div class="card-header"><div><h3>'+escapeHtml(s.name)+'</h3></div><div class="card-actions"><button onclick="handleEditSubject('+s.id+',\''+escapeHtml(s.name).replace(/'/g,"\\'")+'\',\''+escapeHtml(s.description||'').replace(/'/g,"\\'")+'\')"><i class="fas fa-pen"></i></button><button class="danger" onclick="handleDeleteSubject('+s.id+',\''+escapeHtml(s.name).replace(/'/g,"\\'")+'\')" title="Excluir"><i class="fas fa-trash"></i></button></div></div><p>'+escapeHtml(s.description)+'</p><div class="card-meta"><span><i class="fas fa-play-circle"></i> '+lc+' aula'+(lc!==1?'s':'')+'</span></div><div style="margin-top:14px"><button class="btn btn-sm btn-secondary" onclick="navigate(\'admin-subject\',{subjectId:'+s.id+'})"><i class="fas fa-list"></i> Gerenciar Aulas</button></div></div>';
                }).join('');
                area.innerHTML = '<div class="grid">' + cards + '</div>';
            });
        }).catch(function(err) { showToast(err.message, 'error'); });
    }

    /* ============================================================
       VIEW: ADMIN SUBJECT
       ============================================================ */
    function renderAdminSubject() {
        var sid = state.selectedSubjectId;
        var app = document.getElementById('app');
        app.innerHTML = renderNavbar(adminNav()) + '<div class="container"><div class="page-content"><div class="loading-spinner"><i class="fas fa-spinner"></i> Carregando...</div></div></div>';
        Promise.all([API.getSubjects(), API.getLessons(sid)]).then(function(results) {

    function bindAdminSubject() {
        var ui = document.getElementById('new-lesson-url');
        if (ui) ui.addEventListener('input', function() {
            var s=document.getElementById('url-status'),u=this.value.trim();
            if(!u){s.innerHTML='';return;}
            var m=u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if(m){s.innerHTML='<i class="fas fa-check-circle"></i> URL válida';s.className='url-status valid';}
            else{s.innerHTML='<i class="fas fa-times-circle"></i> URL não reconhecida';s.className='url-status invalid';}
        });
        var f = document.getElementById('add-lesson-form');
        if (f) f.addEventListener('submit', function(e) {
            e.preventDefault();
            var t=document.getElementById('new-lesson-title').value.trim(), u=document.getElementById('new-lesson-url').value.trim(), d=parseInt(document.getElementById('new-lesson-duration').value,10)||15;
            if(!t){showToast('Preencha o título','error');return;}
            var btn=document.getElementById('add-lesson-btn'); btn.disabled=true;
            API.createLesson({ subject_id:state.selectedSubjectId, title:t, drive_url:u, duration_minutes:d }).then(function() {
                showToast('Aula adicionada!'); render();
            }).catch(function(err) { showToast(err.message,'error'); btn.disabled=false; });
        });
    }

    function loadPlansHistory() {
        API.getPlansHistory().then(function(plans) {
            var section = document.getElementById('history-section');
            var list = document.getElementById('history-list');
            if (!section || !list) return;
            if (!plans || plans.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            // Check if today's plan already exists and show it
            var today = new Date().toISOString().split('T')[0];
            var todayPlan = plans.find(function(p) { return p.plan_date === today; });
            if (todayPlan) {
                var out = document.getElementById('plan-output');
                if (out && out.style.display === 'none') {
                    out.style.display = 'block';
                    renderPlano(todayPlan.plan_json);
                }
            }
            list.innerHTML = plans.map(function(p, idx) {
                var dateStr = p.plan_date ? new Date(p.plan_date + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '';
                var blocos = (p.plan_json && p.plan_json.blocos) ? p.plan_json.blocos.length + ' blocos' : '';
                return '<div class="history-card" onclick="toggleHistoryCard(this,' + idx + ')">' +
                    '<div class="history-card-header">' +
                      '<div><div class="history-card-date"><i class="fas fa-calendar-check" style="color:var(--primary);margin-right:6px"></i>' + escapeHtml(dateStr) + '</div>' +
                      '<div class="history-card-meta">' + escapeHtml(p.hours_available + 'h disponíveis') + (p.focus_subjects ? ' · ' + escapeHtml(p.focus_subjects) : '') + (blocos ? ' · ' + blocos : '') + '</div></div>' +
                      '<i class="fas fa-chevron-down" style="color:var(--text-muted);transition:transform .2s ease"></i>' +
                    '</div>' +
                    '<div class="history-card-body" id="hcb-' + idx + '">' +
                      renderPlanoInline(p.plan_json) +
                    '</div>' +
                '</div>';
            }).join('');
        }).catch(function() { /* silently ignore */ });
    }

    function toggleHistoryCard(card, idx) {
        var body = document.getElementById('hcb-' + idx);
        var icon = card.querySelector('.fa-chevron-down,.fa-chevron-up');
        if (!body) return;
        var isOpen = body.classList.contains('open');
        body.classList.toggle('open', !isOpen);
        if (icon) { icon.className = isOpen ? 'fas fa-chevron-down' : 'fas fa-chevron-up'; icon.style.transform = isOpen ? '' : 'rotate(180deg)'; }
    }

    function renderPlanoInline(plan) {
        if (!plan) return '<p style="color:var(--text-muted);font-size:.88rem">Plano sem dados.</p>';
        var recTag = { 'Alta': 'tag-alta', 'Média': 'tag-media', 'Baixa': 'tag-baixa' };
        var blocosHtml = (plan.blocos || []).map(function(b) {
            var tags = '';
            if (b.recorrencia) tags += '<span class="tag ' + (recTag[b.recorrencia] || '') + '">' + b.recorrencia + '</span>';
            if (b.materia) tags += '<span class="tag tag-mat">' + escapeHtml(b.materia) + '</span>';
            return '<div class="plan-block">' +
                '<div class="plan-block-time"><i class="fas fa-clock"></i> ' + escapeHtml(b.horario || '') + '</div>' +
                '<div class="plan-block-body"><div style="font-weight:600;font-size:.9rem">' + escapeHtml(b.titulo || '') + '</div>' +
                (b.descricao ? '<div style="font-size:.82rem;color:var(--text-secondary);margin-top:4px">' + escapeHtml(b.descricao) + '</div>' : '') +
                (tags ? '<div class="plan-block-tags" style="margin-top:6px">' + tags + '</div>' : '') +
                '</div></div>';
        }).join('');
        return '<div class="plan-blocks" style="margin-bottom:0">' + blocosHtml + '</div>' +
            (plan.dicaDoDia ? '<div class="plan-dica" style="margin-top:10px"><i class="fas fa-lightbulb"></i> ' + escapeHtml(plan.dicaDoDia) + '</div>' : '');
    }

    function selectHours(btn, h) {
        document.querySelectorAll('.hours-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('planner-hours').value = h;
    }

    function gerarPlano() {
        var hours = parseFloat(document.getElementById('planner-hours').value) || 3;
        var obs = (document.getElementById('planner-obs').value || '').trim();
        var out = document.getElementById('plan-output');
        out.style.display = 'block';
        out.innerHTML = '<div class="plan-loading"><i class="fas fa-spinner fa-spin"></i> O Barão está elaborando seu plano personalizado…</div>';
        API.request('POST', '/api/generate-plan', { horasDisponiveis: hours, observacoes: obs }).then(function(plan) {
            renderPlano(plan);
            loadPlansHistory();
        }).catch(function(err) {
            out.innerHTML = '<div style="color:var(--danger);padding:20px;text-align:center"><i class="fas fa-exclamation-triangle"></i> ' + escapeHtml(err.message) + '</div>';
        });
    }

    function renderPlano(plan) {
        var out = document.getElementById('plan-output');
        var recTag = { 'Alta': 'tag-alta', 'Média': 'tag-media', 'Baixa': 'tag-baixa' };
        var blocosHtml = (plan.blocos || []).map(function(b) {
            var tags = '';
            if (b.recorrencia) tags += '<span class="tag ' + (recTag[b.recorrencia] || '') + '">' + b.recorrencia + '</span>';
            if (b.materia) tags += '<span class="tag tag-mat">' + escapeHtml(b.materia) + '</span>';
            if (b.tipo) tags += '<span class="tag tag-tipo">' + escapeHtml(b.tipo) + '</span>';
            return '<div class="plan-block">' +
                '<div class="plan-block-time"><i class="fas fa-clock"></i> ' + escapeHtml(b.horario || '') + ' <span style="font-size:.8rem;color:var(--text-muted)">(' + (b.duracaoMin || '') + 'min)</span></div>' +
                '<div class="plan-block-body">' +
                  '<div style="font-weight:600;font-size:1rem;margin-bottom:4px">' + escapeHtml(b.titulo || '') + '</div>' +
                  (b.descricao ? '<div style="font-size:.88rem;color:var(--text-secondary);margin-bottom:8px">' + escapeHtml(b.descricao) + '</div>' : '') +
                  (tags ? '<div class="plan-block-tags">' + tags + '</div>' : '') +
                '</div>' +
            '</div>';
        }).join('');
        var pausasHtml = (plan.pausas || []).length ? '<div style="font-size:.85rem;color:var(--text-muted);margin-top:8px"><i class="fas fa-coffee"></i> Pausas: ' + plan.pausas.map(function(p){ return escapeHtml(p); }).join(' · ') + '</div>' : '';
        out.innerHTML =
            '<div class="baron-header">' +
              '<div class="baron-avatar"><img src="/public/baron-avatar.png" alt="Barão" onerror="this.outerHTML=\'<i class=\\\"fas fa-user-tie\\\" style=\\\"font-size:1.6rem;color:#fff\\\"></i>\'"></div>' +
              '<div>' +
                '<div style="font-weight:700;font-size:1.05rem">Barão do EduFlow</div>' +
                '<div style="font-size:.88rem;color:var(--text-secondary)">' + escapeHtml(plan.saudacao || '') + '</div>' +
              '</div>' +
            '</div>' +
            (plan.resumoDia ? '<div style="background:var(--primary-light);border-left:4px solid var(--primary);padding:14px 16px;border-radius:0 var(--radius-md) var(--radius-md) 0;margin-bottom:20px;font-size:.93rem;line-height:1.6">' + escapeHtml(plan.resumoDia) + '</div>' : '') +
            '<div class="plan-blocks">' + blocosHtml + '</div>' +

            (plan.dicaDoDia ? '<div class="plan-dica"><i class="fas fa-lightbulb"></i> <strong>Dica do dia:</strong> ' + escapeHtml(plan.dicaDoDia) + '</div>' : '') +

            if (subjects.length === 0) { area.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><h3>Nenhuma matéria disponível</h3></div>'; return; }
            // Build progress map and fetch lesson counts
            var pMap = {};
            progressList.forEach(function(p) { pMap[p.lesson_id] = p; });
            var promises = subjects.map(function(s) { return API.getLessons(s.id).then(function(ls) { s._lessons = ls; }); });
            Promise.all(promises).then(function() {
                var cards = subjects.map(function(s) {
                    var ls = s._lessons || [], comp = 0;
                    ls.forEach(function(l) { if (pMap[l.id] && pMap[l.id].completed) comp++; });
                    var pct = ls.length > 0 ? Math.round(comp/ls.length*100) : 0;
                    return '<div class="card" onclick="navigate(\'student-subject\',{subjectId:'+s.id+'})" style="cursor:pointer"><div class="card-header"><div><h3>'+escapeHtml(s.name)+'</h3></div><div class="card-tag student">'+pct+'%</div></div><p>'+escapeHtml(s.description)+'</p><div class="card-meta"><span><i class="fas fa-play-circle"></i> '+ls.length+' aulas</span><span><i class="fas fa-check-circle"></i> '+comp+'/'+ls.length+' concluídas</span></div><div class="card-progress-bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';
                }).join('');
                area.innerHTML = '<div class="grid">' + cards + '</div>';
            });
        }).catch(function(err) { showToast(err.message, 'error'); });
    }

        var readings = LESSON_READINGS[subjectName];

            return '<div class="reading-item' + (checked ? ' done' : '') + '" id="ri-' + i + '">' +
                '<input type="checkbox" id="rc-' + i + '" ' + (checked ? 'checked' : '') + ' onchange="toggleReading(' + lessonId + ',' + i + ',this.checked)">' +
                '<label for="rc-' + i + '">' + escapeHtml(r) + '</label>' +
            '</div>';

            '<h3><i class="fas fa-book-open"></i> Leituras Recomendadas — ' + escapeHtml(subjectName) + '</h3>' +

        var item = document.getElementById('ri-' + idx);
        if (item) item.classList.toggle('done', checked);
        // Update counter
        var subjectName = null;
        Object.keys(LESSON_READINGS).forEach(function(k) {
            // find the currently rendered subject by checking rendered items
        });

    function gerarQuestoes(lessonId, subjectName, lessonTitle) {
        var btn = document.getElementById('gen-questions-btn');
        var out = document.getElementById('questions-output');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando questões…'; }
        out.innerHTML = '';
        API.generateQuestions({ lessonId: lessonId, subjectName: subjectName, lessonTitle: lessonTitle, count: 5 }).then(function(data) {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync"></i> Regerar Questões'; }
            renderQuestoes(data.questoes || [], out);
        }).catch(function(err) {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-brain"></i> Tentar Novamente'; }

    function renderQuestoes(questoes, container) {
        if (!questoes || questoes.length === 0) { container.innerHTML = '<p style="color:var(--text-muted);font-size:.88rem">Nenhuma questão disponível.</p>'; return; }
        var answered = {};
        var html = questoes.map(function(q, qi) {
            var opcoesHtml = ['a','b','c','d','e'].map(function(op) {
                var text = q.opcoes && q.opcoes[op] ? q.opcoes[op] : '';
                if (!text) return '';
                return '<label class="questao-opcao" for="q' + qi + op + '">' +
                    '<input type="radio" name="q' + qi + '" id="q' + qi + op + '" value="' + op + '" onchange="selecionarOpcao(' + qi + ',\'' + op + '\')">' +
                    '<span class="opcao-letra">' + op + ')</span>' +
                    '<span class="opcao-texto">' + escapeHtml(text) + '</span>' +
                    '</label>';
            }).join('');
            return '<div class="questao-card" id="qcard-' + qi + '">' +
                '<div class="questao-enunciado"><strong>Questão ' + (qi+1) + '.</strong> ' + escapeHtml(q.enunciado || '') + '</div>' +
                opcoesHtml +
                '<button class="btn btn-sm btn-secondary" style="margin-top:12px" onclick="conferirResposta(' + qi + ',\'' + escapeHtml(q.gabarito || '') + '\',\'' + escapeHtml((q.explicacao || '').replace(/'/g,"\\'")) + '\')">' +
                  '<i class="fas fa-check"></i> Conferir Resposta' +
                '</button>' +
                '<div class="questao-gabarito" id="qgab-' + qi + '"></div>' +
                '<div class="questao-explicacao" id="qexp-' + qi + '">' + escapeHtml(q.explicacao || '') + '</div>' +
            '</div>';
        }).join('');
        html += '<div class="questoes-score" id="questoes-score"></div>';
        container.innerHTML = html;
        container._questoes = questoes;
    }

        // just UI feedback handled by radio

    function conferirResposta(qi, gabarito, explicacao) {
        var radios = document.querySelectorAll('input[name="q' + qi + '"]');
        var selected = null;
        radios.forEach(function(r) { if (r.checked) selected = r.value; });
        var gabEl = document.getElementById('qgab-' + qi);
        var expEl = document.getElementById('qexp-' + qi);
        if (!selected) { showToast('Selecione uma opção antes de conferir', 'error'); return; }
        var correct = selected === gabarito;
        if (gabEl) {
            gabEl.className = 'questao-gabarito show ' + (correct ? 'correct' : 'wrong');
            gabEl.innerHTML = correct
                ? '<i class="fas fa-check-circle"></i> Correto! A alternativa <strong>' + gabarito.toUpperCase() + '</strong> está correta.'
                : '<i class="fas fa-times-circle"></i> Incorreto. A resposta correta é <strong>' + gabarito.toUpperCase() + '</strong>.';
        }
        if (expEl) expEl.classList.add('show');
        // Update score
        updateQuestoesScore();
    }

    function updateQuestoesScore() {
        var scoreEl = document.getElementById('questoes-score');
        if (!scoreEl) return;
        var total = document.querySelectorAll('.questao-card').length;
        var answered = document.querySelectorAll('.questao-gabarito.show').length;
        var correct = document.querySelectorAll('.questao-gabarito.show.correct').length;
        if (answered === total && total > 0) {
            scoreEl.classList.add('show');
            scoreEl.innerHTML = '<i class="fas fa-trophy" style="color:var(--accent);margin-right:8px"></i>Resultado: <strong>' + correct + '/' + total + '</strong> acertos';
        }
    }

    function findLessonAndRender(subjects, lid, prog, nav) {
        // Try each subject until we find the lesson
        var allPromises = subjects.map(function(s) { return API.getLessons(s.id).then(function(ls) { return { subject:s, lessons:ls }; }); });
        return Promise.all(allPromises).then(function(results) {
            var lesson = null, subject = null, allLessons = [];
            for (var i = 0; i < results.length; i++) {
                var found = results[i].lessons.find(function(l) { return l.id === lid; });
                if (found) { lesson = found; subject = results[i].subject; allLessons = results[i].lessons; break; }
            }
            if (!lesson) { navigate('student-dashboard'); return; }

            var ts = lesson.duration_minutes * 60;
            var pp = ts > 0 ? Math.min(100, Math.round(prog.current_time_seconds/ts*100)) : 0;
            if (prog.completed) pp = 100;
            var sm = Math.floor(prog.current_time_seconds/60), ss = prog.current_time_seconds%60;
            var vh = lesson.embed_url ? '<div class="video-wrapper"><iframe src="'+escapeHtml(lesson.embed_url)+'" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>' : '<div class="video-placeholder"><i class="fas fa-film"></i><p>Nenhum vídeo configurado para esta aula</p></div>';
            var rb = (prog.current_time_seconds > 0 && !prog.completed) ? '<div class="resume-banner"><i class="fas fa-play-circle"></i><span>Você parou em <strong>'+formatTime(prog.current_time_seconds)+'</strong> — avance o vídeo para essa posição</span></div>' : '';
            var ci = allLessons.findIndex(function(l){return l.id===lid;});
            var prev = ci>0 ? allLessons[ci-1] : null;
            var next = ci<allLessons.length-1 ? allLessons[ci+1] : null;
            var lnav = '<div class="lesson-nav">'+(prev?'<button class="btn btn-secondary" onclick="navigate(\'student-lesson\',{lessonId:'+prev.id+'})"><i class="fas fa-chevron-left"></i> '+escapeHtml(prev.title)+'</button>':'<div></div>')+(next?'<button class="btn btn-primary" onclick="navigate(\'student-lesson\',{lessonId:'+next.id+'})">'+escapeHtml(next.title)+' <i class="fas fa-chevron-right"></i></button>':'<div></div>')+'</div>';

            var readingsHtml = renderReadingsSection(subject.name, lid);
            var questionsHtml = renderQuestionsSection(lid, subject.name, lesson.title);

            var app = document.getElementById('app');
            app.innerHTML = nav + '<div class="container"><div class="page-content">' +
                '<div class="breadcrumb"><a onclick="navigate(\'student-dashboard\')">Matérias</a><span class="sep"><i class="fas fa-chevron-right"></i></span><a onclick="navigate(\'student-subject\',{subjectId:'+subject.id+'})">'+escapeHtml(subject.name)+'</a><span class="sep"><i class="fas fa-chevron-right"></i></span><span>'+escapeHtml(lesson.title)+'</span></div>' +
                '<h1 style="font-size:1.5rem;margin-bottom:20px">'+escapeHtml(lesson.title)+'</h1>' + rb + vh +
                readingsHtml +
                '<div class="progress-card"><h3><i class="fas fa-bookmark"></i> Salvar seu Progresso</h3><p style="font-size:.88rem;color:var(--text-muted);margin-bottom:16px">Registre o minuto e segundo atual do vídeo para retomar de onde parou.</p><div class="time-input-group"><div><label>Minutos</label><input type="number" id="progress-min" min="0" max="999" value="'+sm+'"></div><span class="time-sep">:</span><div><label>Segundos</label><input type="number" id="progress-sec" min="0" max="59" value="'+ss+'"></div><button class="btn btn-primary btn-sm" id="save-progress-btn" style="align-self:flex-end"><i class="fas fa-save"></i> Salvar</button></div><div class="progress-bar-full"><div class="fill" style="width:'+pp+'%"></div></div><div class="progress-info"><span>'+formatTime(prog.current_time_seconds)+' / '+formatTime(ts)+'</span><span>'+pp+'% concluído</span></div><div class="complete-toggle"><label class="toggle-switch"><input type="checkbox" id="complete-toggle" '+(prog.completed?'checked':'')+'><span class="toggle-slider"></span></label><span>Marcar como concluída</span></div>'+(prog.last_accessed?'<div style="margin-top:12px;font-size:.78rem;color:var(--text-muted)"><i class="fas fa-clock"></i> Último acesso: '+new Date(prog.last_accessed).toLocaleString('pt-BR')+'</div>':'')+'</div>' +
                questionsHtml +
                lnav + '</div></div>';

            // Bind progress events
            document.getElementById('save-progress-btn').addEventListener('click', function() {
                var mins=parseInt(document.getElementById('progress-min').value,10)||0;
                var secs=parseInt(document.getElementById('progress-sec').value,10)||0;
                if(secs>59)secs=59;if(mins<0)mins=0;if(secs<0)secs=0;
                var total = mins*60+secs;
                this.disabled=true; this.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
                API.saveProgress({ lesson_id:lid, current_time_seconds:total }).then(function() {
                    showToast('Progresso salvo: '+formatTime(total)); render();
                }).catch(function(err) { showToast(err.message,'error'); });
            });
            document.getElementById('complete-toggle').addEventListener('change', function() {
                var checked = this.checked;
                API.saveProgress({ lesson_id:lid, completed:checked }).then(function() {
                    showToast(checked?'Aula marcada como concluída!':'Aula desmarcada'); render();
                }).catch(function(err) { showToast(err.message,'error'); });
            });
        });
    }

    function gerarMacroPlan() {
        var dataProva = document.getElementById('macro-data-prova').value;
        var horasPorSemana = parseFloat(document.getElementById('macro-horas').value) || 20;
        var observacoes = (document.getElementById('macro-obs').value || '').trim();
        if (!dataProva) { showToast('Informe a data da prova', 'error'); return; }
        var out = document.getElementById('macro-output');
        out.style.display = 'block';
        out.innerHTML = '<div class="plan-loading"><i class="fas fa-spinner fa-spin"></i><p>O Barão está elaborando seu Plano Mestre… isso pode levar alguns segundos.</p></div>';
        API.generateMacroPlan({ dataProva: dataProva, horasPorSemana: horasPorSemana, observacoes: observacoes }).then(function(plano) {
            renderMacroPlan(plano);
        }).catch(function(err) {
            out.innerHTML = '<div style="color:var(--danger);padding:20px;text-align:center"><i class="fas fa-exclamation-triangle"></i> ' + escapeHtml(err.message) + '</div>';
        });
    }

    function renderMacroPlan(plano) {
        var out = document.getElementById('macro-output');
        var semanasHtml = (plano.semanas || []).map(function(s, i) {
            var materiasHtml = (s.materias || []).map(function(m) {
                var atvsHtml = (m.atividades || []).map(function(a) {
                    return '<div class="macro-atividade"><i class="fas fa-check-circle"></i><span><strong>' + escapeHtml(a.tipo || '') + '</strong> — ' + escapeHtml(a.descricao || '') + (a.horas ? ' (' + a.horas + 'h)' : '') + '</span></div>';
                }).join('');
                return '<div class="macro-materia">' +
                    '<div class="macro-materia-name"><i class="fas fa-book-open" style="margin-right:6px"></i>' + escapeHtml(m.nome || '') + '</div>' +
                    (m.topico ? '<div class="macro-materia-topico">' + escapeHtml(m.topico) + '</div>' : '') +
                    atvsHtml +
                    (m.leituras ? '<div class="macro-leituras"><i class="fas fa-bookmark" style="margin-right:4px"></i>' + escapeHtml(m.leituras) + '</div>' : '') +
                '</div>';
            }).join('');
            var dateStr = '';
            if (s.dataInicio && s.dataFim) dateStr = ' <span style="font-size:.8rem;font-weight:400;color:var(--text-secondary)">' + escapeHtml(s.dataInicio) + ' – ' + escapeHtml(s.dataFim) + '</span>';
            return '<div class="macro-semana">' +
                '<div class="macro-semana-header" onclick="toggleMacraSemana(this,' + i + ')">' +
                  '<span><i class="fas fa-calendar-week" style="color:var(--primary);margin-right:8px"></i>Semana ' + (s.semana || (i+1)) + dateStr + '</span>' +
                  '<i class="fas fa-chevron-down" style="color:var(--text-muted)"></i>' +
                '</div>' +
                '<div class="macro-semana-body" id="msb-' + i + '">' + materiasHtml + '</div>' +
            '</div>';
        }).join('');
        out.innerHTML =
            '<div style="background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:var(--radius-lg);padding:20px 24px;color:#fff;margin-bottom:20px">' +
              '<div style="font-weight:700;font-size:1.1rem;margin-bottom:6px"><i class="fas fa-map" style="margin-right:8px"></i>Plano Mestre Gerado</div>' +
              '<div style="font-size:.92rem;opacity:.9;line-height:1.5">' + escapeHtml(plano.resumo || '') + '</div>' +
              '<div style="margin-top:12px;font-size:.82rem;opacity:.8"><i class="fas fa-clock" style="margin-right:4px"></i>' + (plano.totalSemanas || '') + ' semanas · ' + (plano.totalHoras || '') + 'h totais</div>' +
            '</div>' +
            semanasHtml;
    }

    function toggleMacraSemana(header, idx) {
        var body = document.getElementById('msb-' + idx);
        var icon = header.querySelector('i.fa-chevron-down,i.fa-chevron-up');
        if (!body) return;
        var open = body.classList.contains('open');
        body.classList.toggle('open', !open);
        if (icon) icon.style.transform = open ? '' : 'rotate(180deg)';
    }

        });
    }
    function handleAddUser() {
        showFormModal('Novo Usuário',[{name:'name',label:'Nome Completo',placeholder:'Ex: Ana Oliveira',required:true},{name:'username',label:'Usuário (login)',placeholder:'Ex: ana.oliveira',required:true},{name:'password',label:'Senha',placeholder:'Mín. 4 caracteres',required:true},{name:'role',label:'Perfil',type:'select',value:'student',options:[{value:'student',label:'Aluno'},{value:'admin',label:'Administrador'}]}],'Criar Usuário',function(v) {
            if(!v.name.trim()||!v.username.trim()){showToast('Preencha todos os campos','error');return;}
            if(v.password.length<4){showToast('Senha mín. 4 caracteres','error');return;}
            API.createUser({name:v.name.trim(),username:v.username.trim(),password:v.password,role:v.role}).then(function(){showToast('Usuário criado!');render();}).catch(function(e){showToast(e.message,'error');});
        });
    }
    function handleEditUserApi(id) {
        API.getUsers().then(function(users) {
            var u = users.find(function(x){return x.id===id;});
            if(!u) return;
            showFormModal('Editar Usuário',[{name:'name',label:'Nome',value:u.name,required:true},{name:'username',label:'Usuário',value:u.username,required:true},{name:'password',label:'Nova Senha (vazio = manter)',placeholder:'Deixe vazio para manter'},{name:'role',label:'Perfil',type:'select',value:u.role,options:[{value:'student',label:'Aluno'},{value:'admin',label:'Administrador'}]}],'Salvar',function(v) {
                var data = {name:v.name.trim(),username:v.username.trim(),role:v.role};
                if(v.password) data.password = v.password;
                API.updateUser(id,data).then(function(){showToast('Usuário atualizado');render();}).catch(function(e){showToast(e.message,'error');});
            });
        });
    }
    function handleDeleteUserApi(id, name) {
        showConfirmModal('Excluir Usuário','Excluir "'+name+'"?','Excluir','btn-danger',function() {
            API.deleteUser(id).then(function(){showToast('Excluído');render();}).catch(function(e){showToast(e.message,'error');});
        });
    }

    /* ============================================================
       MAIN RENDER
       ============================================================ */
    function render() {
        var floatBtn = document.getElementById('baron-float');
        if (floatBtn) floatBtn.style.display = (state.user && state.view !== 'login' && state.view !== 'reset' && state.view !== 'student-planner') ? 'block' : 'none';
        switch (state.view) {
            case 'login':             renderLoginView(); break;
            case 'reset':             renderResetView(); break;
            case 'admin-dashboard':   renderAdminDashboard(); break;
            case 'admin-subject':     renderAdminSubject(); break;
            case 'admin-users':       renderAdminUsers(); break;
            case 'admin-schema':      renderAdminSchema(); break;
            case 'student-planner':   renderStudentPlanner(); break;
            case 'student-dashboard': renderStudentDashboard(); break;
            case 'student-subject':   renderStudentSubject(); break;
            case 'student-lesson':         renderStudentLesson(); break;
            case 'student-macro-planner':  renderStudentMacroPlan(); break;
            default:                       renderLoginView();
        }
    }
    function renderLoginView() {
        document.getElementById('app').innerHTML = renderLogin();
        bindLogin();
    }
    function renderResetView() {
        document.getElementById('app').innerHTML = renderResetPassword();
        bindResetPassword();
    }

    /* ============================================================
       INITIALIZATION — check for saved token
       ============================================================ */
    (function init() {
        var urlParams = new URLSearchParams(window.location.search);
        var resetToken = urlParams.get('reset');

        if (resetToken) {
            API.clearToken();
            state.resetToken = resetToken;
            navigate('reset');
            return;
        }

        var token = API.getToken();
        if (token) {
            API.getMe().then(function(data) {
                state.user = data.user;
                navigate(data.user.role === 'admin' ? 'admin-dashboard' : 'student-dashboard');
            }).catch(function() {
                API.clearToken();
                render();
            });
        } else {
            render();
        }
    })();
    </script>
</body>
</html>
