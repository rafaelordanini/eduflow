<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barão — Seu Coach para o CACD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <div class="baron-speech" id="baron-speech"></div>
    <div class="baron-float" id="baron-float" onclick="toggleBaronChat()" title="Converse com o Barão" style="display:none">
        <img src="/baron-winking-sm.png" id="baron-float-img" alt="Barão" onerror="this.outerHTML='<div class=\'baron-float-fallback\'>🎩</div>'">
    </div>
    <div id="baron-chat-modal" style="display:none;position:fixed;bottom:116px;right:24px;z-index:300;width:320px;max-height:480px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);flex-direction:column;overflow:hidden">
      <div style="background:linear-gradient(135deg,var(--primary),var(--primary-hover));padding:12px 16px;display:flex;align-items:center;gap:10px;color:#fff">
        <img src="/baron-winking-sm.png" style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.4)" onerror="this.style.display=\'none\'">
        <div><div style="font-weight:700;font-size:.95rem">Barão</div><div style="font-size:.75rem;opacity:.8">Seu coach diplomático</div></div>
        <button onclick="toggleBaronChat()" style="margin-left:auto;background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px">✕</button>
      </div>
      <div id="baron-chat-messages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:320px"></div>
      <div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px">
        <input id="baron-chat-input" type="text" placeholder="Pergunte ao Barão…" style="flex:1;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:.85rem;outline:none;background:var(--bg)">
        <button onclick="sendBaronMessage()" style="background:var(--primary);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:.9rem;flex-shrink:0"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
    <div id="study-timer-modal" class="study-timer-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="study-timer-title">
      <img src="/baron-thumbsup-sm.png" id="timer-baron-img" class="study-timer-avatar" onerror="this.style.display='none'">
      <p class="study-timer-kicker">Ritual de concentração</p>
      <h2 id="study-timer-title">Preparar sessão de foco</h2>
      <p id="timer-helper" class="study-timer-helper">Escolha uma matéria, defina o tempo e deixe o Barão cuidar do relógio.</p>
      <div id="timer-subject-select" class="study-timer-setup">
        <label>Qual matéria você vai estudar?</label>
        <select id="timer-subject">
          <option value="">Selecione…</option>
          <option>Português</option><option>História do Brasil</option><option>História Mundial</option>
          <option>Política Internacional</option><option>Economia</option><option>Direito Internacional</option>
          <option>Direito Interno</option><option>Geografia</option><option>Inglês</option>
          <option>Francês</option><option>Espanhol</option>
        </select>
        <label>Por quanto tempo?</label>
        <div class="study-timer-presets" role="group" aria-label="Duração do timer">
          <button type="button" class="timer-duration-preset" data-minutes="15" onclick="selectStudyTimerDuration(15, this)">15 min</button>
          <button type="button" class="timer-duration-preset active" data-minutes="25" onclick="selectStudyTimerDuration(25, this)">25 min <small>padrão</small></button>
          <button type="button" class="timer-duration-preset" data-minutes="50" onclick="selectStudyTimerDuration(50, this)">50 min</button>
        </div>
        <div class="study-timer-custom-duration">
          <input id="timer-duration" type="number" min="1" max="240" value="25" aria-label="Duração personalizada em minutos" oninput="syncStudyTimerDurationPreset()">
          <span>minutos</span>
        </div>
      </div>
      <div id="timer-active-panel" class="study-timer-active-panel" style="display:none">
        <div id="timer-active-subject" class="study-timer-subject">Sessão em andamento</div>
        <div id="timer-display" class="study-timer-display" aria-live="polite">25:00</div>
        <div class="study-timer-progress"><span id="timer-progress-fill"></span></div>
      </div>
      <div id="timer-complete-panel" class="study-timer-complete-panel" style="display:none">
        <div class="study-timer-complete-title">Sessão concluída</div>
        <p id="timer-complete-message">Tempo registrado com sucesso.</p>
        <button class="btn btn-primary" onclick="startAnotherStudyTimer(25)"><i class="fas fa-rotate-right"></i> Novo bloco de 25 min</button>
      </div>
      <div class="study-timer-actions">
        <button id="timer-start-btn" class="btn btn-primary" onclick="startStudyTimer()" aria-label="Começar timer"><i class="fas fa-play"></i> Começar foco</button>
        <button id="timer-pause-btn" class="btn btn-secondary" onclick="pauseStudyTimer()" style="display:none" aria-label="Pausar ou retomar timer"><i class="fas fa-pause"></i> Pausar</button>
        <button id="timer-cancel-btn" class="btn btn-danger" onclick="cancelStudyTimer()" style="display:none" aria-label="Cancelar timer"><i class="fas fa-times"></i> Cancelar sessão</button>
        <button class="btn btn-secondary" onclick="closeStudyTimer()">Fechar</button>
      </div>
    </div>
    <div id="study-timer-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:399" onclick="closeStudyTimer()"></div>

    <script src="./js/app.js"></script>
</body>
</html>
