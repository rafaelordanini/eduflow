<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barão — Seu Coach para o CACD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <div class="baron-speech" id="baron-speech"></div>
    <div class="baron-float" id="baron-float" onclick="toggleBaronChat()" title="Converse com o Barão" style="display:none">
        <img src="/baron-winking-sm.png" id="baron-float-img" alt="Barão" onerror="this.outerHTML='<div class=\'baron-float-fallback\'>🎩</div>'">
    </div>
    <div id="baron-chat-modal" style="display:none;position:fixed;bottom:116px;right:24px;z-index:300;width:320px;max-height:480px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);flex-direction:column;overflow:hidden">
      <div style="background:linear-gradient(135deg,var(--primary),var(--primary-hover));padding:12px 16px;display:flex;align-items:center;gap:10px;color:#fff">
        <img src="/baron-winking-sm.png" style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.4)" onerror="this.style.display=\'none\'">
        <div><div style="font-weight:700;font-size:.95rem">Barão</div><div style="font-size:.75rem;opacity:.8">Seu coach diplomático</div></div>
        <button onclick="toggleBaronChat()" style="margin-left:auto;background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px">✕</button>
      </div>
      <div id="baron-chat-messages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:320px"></div>
      <div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px">
        <input id="baron-chat-input" type="text" placeholder="Pergunte ao Barão…" style="flex:1;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:.85rem;outline:none;background:var(--bg)">
        <button onclick="sendBaronMessage()" style="background:var(--primary);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:.9rem;flex-shrink:0"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
    <div id="study-timer-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:400;background:var(--surface);border-radius:var(--radius-lg);padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.2);min-width:300px;text-align:center">
      <img src="/baron-thumbsup-sm.png" id="timer-baron-img" style="width:64px;height:64px;border-radius:50%;margin-bottom:12px" onerror="this.style.display=\'none\'">
      <h2 style="font-family:'Fraunces',serif;font-size:1.4rem;margin-bottom:16px">Sessão de Estudo</h2>
      <div id="timer-subject-select" style="margin-bottom:20px">
        <label style="font-size:.88rem;color:var(--text-muted);display:block;margin-bottom:8px">Qual matéria você vai estudar?</label>
        <select id="timer-subject" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:.95rem;background:var(--bg)">
          <option value="">Selecione…</option>
          <option>Português</option><option>História do Brasil</option><option>História Mundial</option>
          <option>Política Internacional</option><option>Economia</option><option>Direito Internacional</option>
          <option>Direito Interno</option><option>Geografia</option><option>Inglês</option>
          <option>Francês</option><option>Espanhol</option>
        </select>
      </div>
      <div id="timer-display" style="font-size:3rem;font-weight:800;font-family:'Fraunces',serif;color:var(--primary);margin-bottom:20px;display:none">00:00:00</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button id="timer-start-btn" class="btn btn-primary" onclick="startStudyTimer()"><i class="fas fa-play"></i> Começar</button>
        <button id="timer-stop-btn" class="btn btn-danger" onclick="stopStudyTimer()" style="display:none"><i class="fas fa-stop"></i> Encerrar</button>
        <button class="btn btn-secondary" onclick="closeStudyTimer()">Fechar</button>
      </div>
    </div>
    <div id="study-timer-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:399" onclick="closeStudyTimer()"></div>

    <script src="./js/app.js"></script>
</body>
</html>
