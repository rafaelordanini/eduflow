<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barão — Seu Coach para o CACD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#f7f5f0;--bg-pattern:radial-gradient(circle at 15% 40%,rgba(27,107,82,.04) 0%,transparent 55%),radial-gradient(circle at 85% 25%,rgba(200,93,44,.03) 0%,transparent 50%);--surface:#fff;--surface-hover:#faf9f6;--primary:#1b6b52;--primary-hover:#145640;--primary-light:rgba(27,107,82,.08);--primary-text:#fff;--accent:#c85d2c;--accent-hover:#a94e24;--accent-light:rgba(200,93,44,.08);--text:#1a1d23;--text-secondary:#555b66;--text-muted:#8b919d;--danger:#c0392b;--danger-hover:#a5311f;--success:#27ae60;--warning:#e8a317;--border:#e2ded6;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 14px rgba(0,0,0,.08);--shadow-lg:0 10px 35px rgba(0,0,0,.12);--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--transition:.2s ease;--code-bg:#f0ece4}
        .dark{--bg:#0c1017;--bg-pattern:radial-gradient(circle at 15% 40%,rgba(77,216,160,.03) 0%,transparent 55%),radial-gradient(circle at 85% 25%,rgba(240,149,74,.03) 0%,transparent 50%);--surface:#1a2030;--surface-hover:#212940;--primary:#4dd8a0;--primary-hover:#3ec98e;--primary-light:rgba(77,216,160,.08);--primary-text:#0c1017;--accent:#f0954a;--accent-hover:#e07c2e;--accent-light:rgba(240,149,74,.08);--text:#e4e8f0;--text-secondary:#a0a8b8;--text-muted:#6b7380;--danger:#e74c3c;--danger-hover:#c0392b;--success:#2ecc71;--warning:#f1c40f;--border:#2a3348;--shadow-sm:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 14px rgba(0,0,0,.3);--shadow-lg:0 10px 35px rgba(0,0,0,.4);--code-bg:#141a26}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Figtree',sans-serif;background:var(--bg);background-image:var(--bg-pattern);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
        h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:700;line-height:1.25}
        a{color:var(--primary);text-decoration:none}
        .container{max-width:1100px;margin:0 auto;padding:0 20px}
        .page-content{padding:32px 0 60px;animation:fadeUp .4s ease}
        .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:28px}
        .page-header h1{font-size:1.8rem}
        .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--text-muted);margin-bottom:20px;flex-wrap:wrap}
        .breadcrumb a{color:var(--primary);cursor:pointer;transition:opacity var(--transition)}
        .breadcrumb a:hover{opacity:.7}
        .breadcrumb .sep{font-size:.7rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
        /* Navbar */
        .navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
        .navbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
        .navbar-brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
        .navbar-brand .logo{width:34px;height:34px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--primary-text);font-weight:800;font-size:1.1rem;font-family:'Fraunces',serif}
        .navbar-brand span{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem}
        .navbar-links{display:flex;align-items:center;gap:4px;overflow-x:auto}
        .navbar-links button{background:none;border:none;color:var(--text-secondary);font-family:'Figtree',sans-serif;font-size:.85rem;font-weight:500;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);white-space:nowrap}
        .navbar-links button:hover,.navbar-links button.active{background:var(--primary-light);color:var(--primary)}
        .navbar-user{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--text-secondary);flex-shrink:0}
        .navbar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem}
        .navbar-user .logout-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px;transition:color var(--transition)}
        .navbar-user .logout-btn:hover{color:var(--danger)}
        /* Login */
        .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-card{background:var(--surface);border-radius:var(--radius-xl);padding:48px 40px;box-shadow:var(--shadow-lg);max-width:420px;width:100%;text-align:center;border:1px solid var(--border);animation:fadeUp .5s ease}
        .login-logo{width:64px;height:64px;background:var(--primary);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;color:var(--primary-text);font-family:'Fraunces',serif;font-weight:800;font-size:1.8rem;margin-bottom:20px}
        .login-card h1{font-size:1.6rem;margin-bottom:6px}
        .login-card .subtitle{color:var(--text-muted);font-size:.95rem;margin-bottom:32px}
        .login-error{background:rgba(192,57,43,.08);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:16px;display:none;text-align:left}
        .login-error.show{display:flex;align-items:center;gap:8px}
        .password-wrapper{position:relative}
        .password-wrapper input{padding-right:44px}
        .password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px;transition:color var(--transition);width:auto}
        .password-toggle:hover{color:var(--text)}
        /* Cards */
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:all .25s ease;position:relative;overflow:hidden}
        .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
        .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
        .card h3{font-size:1.15rem}
        .card p{color:var(--text-secondary);font-size:.9rem;margin-bottom:16px}
        .card-meta{display:flex;align-items:center;gap:16px;font-size:.82rem;color:var(--text-muted)}
        .card-meta i{margin-right:4px}
        .card-actions{display:flex;gap:6px}
        .card-actions button{width:34px;height:34px;border:none;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all var(--transition);background:var(--surface-hover);color:var(--text-secondary)}
        .card-actions button:hover{background:var(--primary-light);color:var(--primary)}
        .card-actions button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .card-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
        .card-tag.admin{background:var(--accent-light);color:var(--accent)}
        .card-tag.student{background:var(--primary-light);color:var(--primary)}
        .card-progress-bar{height:5px;background:var(--border);border-radius:99px;margin-top:14px;overflow:hidden}
        .card-progress-bar .fill{height:100%;background:var(--primary);border-radius:99px;transition:width .5s ease}
        /* Forms */
        .form-group{margin-bottom:18px}
        .form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--text-secondary)}
        input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:'Figtree',sans-serif;font-size:16px;transition:border-color var(--transition);outline:none}
        input:focus,textarea:focus,select:focus{border-color:var(--primary)}
        textarea{resize:vertical;min-height:80px}
        .form-row{display:flex;gap:14px}
        .form-row .form-group{flex:1}
        .form-hint{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .url-status{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;margin-top:4px;font-weight:500}
        .url-status.valid{color:var(--success)}
        .url-status.invalid{color:var(--danger)}
        .form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:24px}
        .form-card h3{margin-bottom:20px;font-size:1.1rem}
        /* Buttons */
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap}
        .btn-primary{background:var(--primary);color:var(--primary-text)}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-accent{background:var(--accent);color:#fff}
        .btn-accent:hover{background:var(--accent-hover)}
        .btn-secondary{background:var(--surface-hover);color:var(--text-secondary);border:1px solid var(--border)}
        .btn-secondary:hover{background:var(--border)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{background:var(--danger-hover)}
        .btn-sm{padding:7px 14px;font-size:.82rem}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        /* Lesson List */
        .lesson-list{display:flex;flex-direction:column;gap:8px}
        .lesson-item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);transition:all var(--transition)}
        .lesson-item:hover{background:var(--surface-hover)}
        .lesson-item .order-num{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
        .lesson-item .lesson-info{flex:1;min-width:0}
        .lesson-item .lesson-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lesson-item .lesson-meta{font-size:.8rem;color:var(--text-muted);margin-top:2px}
        .lesson-item .lesson-actions{display:flex;gap:4px;flex-shrink:0}
        .lesson-item .lesson-actions button{width:30px;height:30px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all var(--transition)}
        .lesson-item .lesson-actions button:hover{background:var(--primary-light);color:var(--primary)}
        .lesson-item .lesson-actions button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .lesson-item.clickable{cursor:pointer}
        .lesson-item .status-icon{flex-shrink:0;font-size:1rem}
        .lesson-item .status-icon.complete{color:var(--success)}
        .lesson-item .status-icon.in-progress{color:var(--warning)}
        .lesson-item .status-icon.pending{color:var(--border)}
        /* Video */
        .video-wrapper{background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow-md)}
        .video-wrapper iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
        .video-placeholder{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius-lg);margin-bottom:24px;color:var(--text-muted)}
        .video-placeholder i{font-size:3rem;margin-bottom:12px;opacity:.4}
        .video-placeholder p{font-size:.95rem}
        /* Progress */
        .progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .progress-card h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .progress-card h3 i{color:var(--accent)}
        .time-input-group{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .time-input-group input[type="number"]{width:80px;text-align:center;font-size:1.1rem;font-weight:600;padding:10px 8px;-moz-appearance:textfield}
        .time-input-group input[type="number"]::-webkit-inner-spin-button,.time-input-group input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}
        .time-input-group .time-sep{font-size:1.3rem;font-weight:700;color:var(--text-muted)}
        .time-input-group label{font-size:.78rem;color:var(--text-muted)}
        .progress-bar-full{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:16px 0}
        .progress-bar-full .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .6s ease}
        .progress-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-muted)}
        .complete-toggle{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
        .toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
        .toggle-switch input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:99px;cursor:pointer;transition:all var(--transition)}
        .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform var(--transition);box-shadow:var(--shadow-sm)}
        .toggle-switch input:checked+.toggle-slider{background:var(--success)}
        .toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
        .complete-toggle span{font-size:.9rem;font-weight:500}
        .resume-banner{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--accent);font-weight:500;animation:fadeUp .3s ease}
        .resume-banner i{font-size:1.1rem}
        .lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
        /* User Table */
        .user-table{width:100%;border-collapse:collapse}
        .user-table th{text-align:left;font-size:.82rem;font-weight:600;color:var(--text-muted);padding:10px 14px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
        .user-table td{padding:14px;border-bottom:1px solid var(--border);font-size:.92rem;vertical-align:middle}
        .user-table tr:hover td{background:var(--surface-hover)}
        .user-table .role-badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
        .user-table .role-badge.admin{background:var(--accent-light);color:var(--accent)}
        .user-table .role-badge.student{background:var(--primary-light);color:var(--primary)}
        .user-table .actions-cell button{width:30px;height:30px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;transition:all var(--transition);vertical-align:middle}
        .user-table .actions-cell button:hover{background:var(--primary-light);color:var(--primary)}
        .user-table .actions-cell button.danger:hover{background:rgba(192,57,43,.1);color:var(--danger)}
        .user-table .mono{font-family:'Courier New',monospace;font-size:.85rem;color:var(--text-secondary)}
        /* Modals */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s ease;backdrop-filter:blur(4px)}
        .modal{background:var(--surface);border-radius:var(--radius-lg);padding:32px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);animation:scaleIn .25s ease;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
        .modal h3{font-size:1.2rem;margin-bottom:12px}
        .modal p{color:var(--text-secondary);font-size:.95rem;margin-bottom:24px}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px}
        /* Toasts */
        #toast-container{position:fixed;top:76px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;border-radius:var(--radius-md);font-size:.88rem;font-weight:500;color:#fff;box-shadow:var(--shadow-md);transform:translateX(120%);transition:transform .3s ease;min-width:220px;display:flex;align-items:center;gap:8px}
        .toast.show{transform:translateX(0)}
        .toast-success{background:var(--success)}
        .toast-error{background:var(--danger)}
        .toast-info{background:var(--primary)}
        /* Empty + Loading */
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state i{font-size:3rem;margin-bottom:16px;opacity:.3}
        .empty-state h3{color:var(--text-secondary);margin-bottom:8px;font-size:1.1rem}
        .empty-state p{font-size:.9rem}
        .loading-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);gap:10px;font-size:.95rem}
        .loading-spinner i{animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* Animations */
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        .card,.lesson-item,.form-card{animation:fadeUp .4s ease backwards}
        /* Responsive */
        /* Planner */
        .planner-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px}
        .hours-selector{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
        .hours-btn{padding:8px 18px;border:1.5px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text-secondary);font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all var(--transition)}
        .hours-btn.active,.hours-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
        .plan-output{margin-top:8px}
        .baron-header{display:flex;align-items:center;gap:14px;padding:20px 24px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:var(--radius-lg);color:#fff;margin-bottom:20px}
        .baron-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
        .baron-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        .baron-avatar-sm{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--primary-light)}
        .baron-avatar-sm img{width:100%;height:100%;object-fit:cover}
        .baron-float{position:fixed;bottom:24px;right:24px;z-index:200;cursor:pointer;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));transition:transform .2s ease}
        .baron-float:hover{transform:scale(1.1) rotate(-3deg)}
        .baron-float img{width:80px;height:80px;border-radius:50%;border:3px solid var(--primary);background:var(--primary);object-fit:cover}
        .baron-float-fallback{width:80px;height:80px;border-radius:50%;border:3px solid var(--primary);background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2rem}
        .baron-speech{position:fixed;bottom:116px;right:24px;z-index:199;background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 4px 12px;padding:10px 14px;font-size:.82rem;color:var(--text);max-width:200px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;animation:fadeInUp .3s ease}
        .baron-speech::after{content:'';position:absolute;bottom:-8px;right:22px;border:4px solid transparent;border-top-color:var(--border)}
        .baron-speech::before{content:'';position:absolute;bottom:-6px;right:23px;border:3px solid transparent;border-top-color:var(--surface);z-index:1}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.8}}
        .baron-reaction{position:fixed;bottom:116px;right:24px;z-index:199;font-size:1.4rem;animation:popIn .4s ease;pointer-events:none}
        @keyframes popIn{0%{transform:scale(0) translateY(10px);opacity:0}60%{transform:scale(1.3) translateY(-4px)}100%{transform:scale(1) translateY(0);opacity:1}}
        .baron-header .baron-msg{flex:1}
        .baron-header .baron-msg h3{font-size:1rem;font-weight:600;opacity:.85;margin-bottom:4px}
        .baron-header .baron-msg p{font-size:.95rem;line-height:1.5}
        .plan-resumo{background:var(--accent-light);border:1px solid rgba(200,93,44,.2);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:20px;font-size:.92rem;color:var(--text);line-height:1.6}
        .plan-blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
        .plan-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;display:flex;gap:16px;align-items:flex-start}
        .plan-block.pausa{background:var(--surface-hover);border-style:dashed;opacity:.7}
        .plan-block-time{font-size:.78rem;font-weight:700;color:var(--text-muted);white-space:nowrap;padding-top:2px;min-width:110px}
        .plan-block-body{flex:1}
        .plan-block-title{font-weight:700;font-size:.95rem;margin-bottom:4px}

        .plan-dica{background:var(--primary-light);border-radius:var(--radius-md);padding:14px 18px;font-size:.88rem;color:var(--text);display:flex;gap:10px;align-items:flex-start}

        /* Plan History */

        .history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:all var(--transition)}
        .history-card:hover{background:var(--surface-hover);box-shadow:var(--shadow-sm)}
        .history-card-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .history-card-date{font-weight:700;font-size:.95rem}
        .history-card-meta{font-size:.82rem;color:var(--text-muted)}
        .history-card-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none}
        .history-card-body.open{display:block}
        /* Macro Planner */
        .macro-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px}
        .macro-form h2{font-size:1.15rem;margin-bottom:20px}
        .macro-output{margin-top:8px}
        .macro-semana{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:12px;overflow:hidden}
        .macro-semana-header{padding:14px 20px;background:var(--primary-light);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.95rem}
        .macro-semana-header .sem-progress{font-size:.78rem;color:var(--text-muted);font-weight:400;margin-left:8px}
        .macro-semana-body{padding:16px 20px;display:none;border-top:1px solid var(--border)}
        .macro-semana-body.open{display:block}
        .macro-materia{margin-bottom:12px;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface-hover);position:relative}
        .macro-materia.done-item{opacity:.6}
        .macro-materia.tipo-revisao{border-left:3px solid var(--accent)}
        .macro-materia.tipo-estudo{border-left:3px solid var(--primary)}
        .macro-materia-header{display:flex;align-items:flex-start;gap:10px}
        .macro-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;transition:all .2s}
        .macro-check.checked{background:var(--success);border-color:var(--success)}
        .macro-check.checked-rev{background:var(--accent);border-color:var(--accent)}
        .macro-materia-body{flex:1;min-width:0}
        .macro-materia-name{font-weight:700;font-size:.92rem;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .macro-materia-topico{font-size:.84rem;color:var(--text-secondary);margin-bottom:6px}
        .macro-atividade{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--text-secondary);margin-bottom:4px}
        .macro-atividade i{color:var(--accent);margin-top:2px;flex-shrink:0}
        .macro-leituras{font-size:.8rem;color:var(--text-muted);margin-top:6px;font-style:italic}
        .macro-links{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
        .macro-link-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
        .macro-link-btn.lesson{background:var(--primary-light);color:var(--primary)}
        .macro-link-btn.lesson:hover{background:var(--primary);color:#fff}
        .macro-link-btn.exercise{background:var(--accent-light);color:var(--accent)}
        .macro-link-btn.exercise:hover{background:var(--accent);color:#fff}
        .macro-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700}
        .macro-badge.estudo{background:var(--primary-light);color:var(--primary)}
        .macro-badge.revisao{background:var(--accent-light);color:var(--accent)}
        /* Review practice modal */
        .review-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
        .review-modal{background:var(--surface);border-radius:var(--radius-xl);padding:28px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
        /* Lesson Readings */
        .readings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .readings-section h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .readings-section h3 i{color:var(--primary)}
        .reading-progress{font-size:.82rem;color:var(--text-muted);margin-bottom:14px}
        .reading-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity var(--transition)}
        .reading-item:last-child{border-bottom:none}
        .reading-item:hover{opacity:.8}
        .reading-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
        .reading-item label{flex:1;font-size:.9rem;cursor:pointer;line-height:1.4}
        .reading-item.done label{text-decoration:line-through;color:var(--text-muted)}
        /* Questions Section */
        .questions-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .questions-section h3{font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .questions-section h3 i{color:var(--accent)}
        .questao-card{background:var(--surface-hover);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:12px}
        .topic-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:600;letter-spacing:.03em;margin-bottom:10px;cursor:default;user-select:none}
        .topic-badge.definido{background:var(--primary-light);color:var(--primary)}
        .topic-badge.indefinido{background:var(--surface-hover);color:var(--text-muted);border:1px dashed var(--border);cursor:pointer}
        .topic-badge.indefinido:hover{background:var(--border);color:var(--text-secondary)}
        .topic-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px}
        .topic-modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.2)}
        .topic-modal h3{font-size:1rem;margin-bottom:16px}
        .topic-option{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:.9rem;transition:background var(--transition);border:1px solid transparent}
        .topic-option:hover{background:var(--primary-light);border-color:var(--primary-light);color:var(--primary)}
        .questao-enunciado{font-size:.92rem;line-height:1.6;font-weight:500;margin-bottom:14px}
        .questao-opcao{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);margin-bottom:6px;border:1px solid transparent}
        .questao-opcao:hover{background:var(--primary-light);border-color:var(--primary-light)}
        .questao-opcao input[type="radio"]{width:16px;height:16px;margin-top:2px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
        .questao-opcao .opcao-letra{font-weight:700;color:var(--primary);font-size:.9rem;flex-shrink:0;min-width:20px}
        .questao-opcao .opcao-texto{flex:1;font-size:.9rem;cursor:pointer;line-height:1.5;color:var(--text)}
        .questao-gabarito{margin-top:14px;padding:12px 16px;border-radius:var(--radius-sm);font-size:.88rem;display:none}
        .questao-gabarito.show{display:block}
        .questao-gabarito.correct{background:rgba(39,174,96,.1);border:1px solid var(--success);color:var(--success)}
        .questao-gabarito.wrong{background:rgba(192,57,43,.08);border:1px solid var(--danger);color:var(--danger)}
        .questao-explicacao{margin-top:10px;padding:12px 14px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:.85rem;color:var(--text);line-height:1.6;display:none}
        .questao-explicacao.show{display:block}
        .questoes-score{text-align:center;padding:20px;font-size:1.1rem;font-weight:700;color:var(--primary);display:none}
        .questoes-score.show{display:block}
        .simulado-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px}
        .simulado-option{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:.95rem;line-height:1.4}
        .simulado-option:last-child{border-bottom:none}
        .simulado-option input[type=radio]{flex-shrink:0;width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
        .simulado-timer{font-size:1.2rem;font-weight:700;color:var(--primary);font-family:'Fraunces',serif}
        .simulado-progress{font-size:.85rem;color:var(--text-muted)}
        .simulado-result{text-align:center;padding:32px}
        .simulado-score{font-size:3rem;font-weight:800;font-family:'Fraunces',serif;color:var(--primary)}
        .simulado-subject-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}
        /* Performance Dashboard */
        .perf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .perf-bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;margin-bottom:4px}
        .perf-bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
        .subject-perf-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
        .subject-perf-row:last-child{border-bottom:none}
        .subject-perf-name{min-width:160px;font-weight:600;font-size:.92rem}
        .subject-perf-bar-wrap{flex:1;min-width:100px}
        .subject-perf-stats{font-size:.82rem;color:var(--text-muted);white-space:nowrap}
        .baron-recommend{background:var(--primary-light);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;display:flex;gap:16px;align-items:flex-start}
        .baron-recommend .baron-rec-msg{flex:1}
        .baron-recommend .baron-rec-msg h3{font-size:1rem;margin-bottom:6px;color:var(--primary)}
        .baron-recommend .baron-rec-msg p{font-size:.9rem;color:var(--text);line-height:1.5}

        /* Zen premium redesign */
        :root{
            --bg:#F7F5EF;--bg-secondary:#F1EFE7;--surface:#FFFFFF;--surface-hover:#EEF3EF;
            --primary:#2F6F62;--primary-hover:#24584E;--primary-light:rgba(47,111,98,.10);
            --primary-text:#FFFFFF;--accent:#C89B5A;--accent-hover:#AD8248;--accent-light:rgba(200,155,90,.14);
            --seal:#B85C4A;--text:#1F2933;--text-strong:#102820;--text-secondary:#697586;--text-muted:#87919D;
            --danger:#B85C4A;--danger-hover:#984C3D;--success:#2F6F62;--warning:#C89B5A;
            --border:#DCE5DF;--border-warm:#E5DED0;--shadow-sm:0 1px 2px rgba(16,40,32,.04);
            --shadow-md:0 12px 28px rgba(16,40,32,.08);--shadow-lg:0 24px 60px rgba(16,40,32,.12);
            --radius-sm:12px;--radius-md:18px;--radius-lg:24px;--radius-xl:32px;--transition:.22s ease;
            --code-bg:#F1EFE7;--mist:#A9CFC3;--jade-soft:#4FA68D;
        }
        .dark{--bg:#F7F5EF;--bg-secondary:#F1EFE7;--surface:#FFFFFF;--surface-hover:#EEF3EF;--primary:#2F6F62;--primary-hover:#24584E;--primary-light:rgba(47,111,98,.10);--primary-text:#FFFFFF;--accent:#C89B5A;--accent-hover:#AD8248;--accent-light:rgba(200,155,90,.14);--seal:#B85C4A;--text:#1F2933;--text-strong:#102820;--text-secondary:#697586;--text-muted:#87919D;--danger:#B85C4A;--success:#2F6F62;--warning:#C89B5A;--border:#DCE5DF;--border-warm:#E5DED0;--shadow-sm:0 1px 2px rgba(16,40,32,.04);--shadow-md:0 12px 28px rgba(16,40,32,.08);--shadow-lg:0 24px 60px rgba(16,40,32,.12);--code-bg:#F1EFE7}
        body{
            font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background-color:var(--bg);
            background-image:
                radial-gradient(circle at 74% 10%,rgba(169,207,195,.32),transparent 28%),
                radial-gradient(circle at 4% 58%,rgba(169,207,195,.18),transparent 28%),
                linear-gradient(120deg,rgba(255,255,255,.62),rgba(241,239,231,.42)),
                repeating-linear-gradient(90deg,rgba(16,40,32,.018) 0 1px,transparent 1px 22px);
            color:var(--text);letter-spacing:0;
        }
        body::before{
            content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.46;
            background:
                linear-gradient(115deg,transparent 0 54px,rgba(47,111,98,.10) 55px,transparent 56px) left 9% top 120px/90px 260px no-repeat,
                linear-gradient(70deg,transparent 0 45px,rgba(47,111,98,.08) 46px,transparent 47px) left 3% top 250px/80px 220px no-repeat,
                radial-gradient(ellipse at 88% 78%,rgba(169,207,195,.22),transparent 34%);
        }
        body::after{
            content:'';position:fixed;right:-4vw;top:82px;width:44vw;height:260px;pointer-events:none;z-index:-1;opacity:.42;
            background:
                radial-gradient(ellipse at 30% 84%,rgba(47,111,98,.20) 0 22%,transparent 23%),
                radial-gradient(ellipse at 52% 76%,rgba(47,111,98,.16) 0 24%,transparent 25%),
                radial-gradient(ellipse at 76% 86%,rgba(47,111,98,.13) 0 26%,transparent 27%);
            filter:blur(10px);
        }
        h1,h2,h3,h4,.brand-title,.display-title{font-family:'Cormorant Garamond','Noto Serif',Georgia,serif;color:var(--text-strong);font-weight:700;letter-spacing:0}
        .container{max-width:1180px;padding:0 24px}.page-content{padding:48px 0 80px}.page-header{margin-bottom:30px}.page-header h1{font-size:3rem}
        .page-kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);font-weight:700;margin-bottom:8px}
        .page-subtitle{color:var(--text-secondary);font-size:1rem;max-width:620px;margin-top:6px}
        .section-title{display:flex;align-items:center;gap:10px;font-size:1.45rem;margin:28px 0 14px}.section-title i{color:var(--primary);font-size:1rem}
        .navbar{background:rgba(247,245,239,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--border-warm);box-shadow:none;padding:0 24px}
        .navbar-inner{max-width:1180px;height:72px}.navbar-brand{gap:12px}.navbar-brand .logo{width:44px!important;height:44px!important;border-radius:50%;background:var(--surface)!important;box-shadow:var(--shadow-sm)}
        .navbar-brand .logo img{width:44px!important;height:44px!important}.navbar-brand span{font-size:1.55rem;color:var(--text-strong);line-height:1}
        .navbar-brand::after{content:'Seu Coach Diplomático';font-size:.73rem;color:var(--text-secondary);position:absolute;margin-left:56px;margin-top:34px;font-family:'Inter',sans-serif;font-weight:500}
        .navbar-links{gap:8px}.navbar-links button{position:relative;border-radius:0;padding:24px 14px 22px;background:transparent;color:var(--text);font-size:.9rem}
        .navbar-links button i{color:inherit;margin-right:6px}.navbar-links button:hover,.navbar-links button.active{background:transparent;color:var(--primary)}
        .navbar-links button.active::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--primary);border-radius:99px}
        .navbar-user{gap:12px}.navbar-user .avatar{width:40px;height:40px;background:var(--surface-hover);border:1px solid var(--border);color:var(--text-strong)}
        .navbar-user .logout-btn{color:var(--text-muted)}.navbar-user .btn-accent{background:linear-gradient(135deg,var(--primary),#1F5E51);color:#fff;box-shadow:0 10px 22px rgba(47,111,98,.22);border-radius:12px;padding:12px 22px}
        .card,.form-card,.planner-form,.macro-form,.perf-card,.simulado-card,.questions-section,.readings-section{
            background:rgba(255,255,255,.84);border:1px solid var(--border-warm);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);backdrop-filter:blur(12px)
        }
        .card{padding:26px}.card:hover,.simulado-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:#CCDCD2}.card h3{font-size:1.45rem}
        .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
        .btn{border-radius:12px;padding:11px 18px}.btn-primary{background:linear-gradient(135deg,var(--primary),#1F5E51);box-shadow:0 10px 22px rgba(47,111,98,.18)}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(47,111,98,.24)}
        .btn-accent{background:var(--primary);color:#fff}.btn-secondary{background:rgba(255,255,255,.72);border:1px solid var(--border);color:var(--text-strong)}.btn-secondary:hover{background:var(--surface-hover);border-color:var(--mist)}
        .card-tag,.tag,.macro-badge,.zen-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-hover);color:var(--primary);font-size:.78rem;font-weight:700;border:1px solid rgba(47,111,98,.08)}
        .card-progress-bar,.progress-bar-full,.perf-bar{height:6px;background:#E8E8DF;border-radius:99px}.card-progress-bar .fill,.progress-bar-full .fill,.perf-bar-fill{background:linear-gradient(90deg,var(--primary),var(--jade-soft));border-radius:99px}
        input,textarea,select{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.72);color:var(--text);font-family:'Inter',sans-serif}input:focus,textarea:focus,select:focus{border-color:var(--mist);box-shadow:0 0 0 4px rgba(169,207,195,.22)}
        .zen-hero{position:relative;display:flex;align-items:center;gap:28px;min-height:178px;padding:34px 42px;margin-bottom:28px;background:linear-gradient(90deg,rgba(255,255,255,.88),rgba(238,243,239,.78));border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow-sm);overflow:hidden}
        .zen-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 74% 24%,rgba(200,155,90,.20) 0 14px,transparent 15px),radial-gradient(ellipse at 82% 92%,rgba(47,111,98,.14) 0 34%,transparent 35%),radial-gradient(ellipse at 96% 82%,rgba(47,111,98,.10) 0 30%,transparent 31%);opacity:.85}
        .zen-hero::after{content:'';position:absolute;right:24px;bottom:22px;width:24px;height:36px;border:1.5px solid var(--seal);border-radius:5px;opacity:.72}
        .zen-hero>*{position:relative;z-index:1}.zen-hero-avatar{width:112px;height:112px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.9);box-shadow:0 14px 30px rgba(16,40,32,.12);object-fit:cover;flex-shrink:0}
        .zen-hero h1{font-size:2.25rem;margin-bottom:8px}.zen-hero p{max-width:560px;color:var(--text-secondary)}
        .zen-page-title{display:flex;align-items:center;gap:18px;margin-bottom:26px}.zen-title-icon{width:58px;height:58px;border-radius:20px;background:var(--surface-hover);display:inline-flex;align-items:center;justify-content:center;color:var(--primary);font-size:1.45rem;border:1px solid var(--border)}

<body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <div class="baron-speech" id="baron-speech"></div>
    <div class="baron-float" id="baron-float" onclick="toggleBaronChat()" title="Converse com o Barão" style="display:none">

    </div>
    <div id="baron-chat-modal" style="display:none;position:fixed;bottom:116px;right:24px;z-index:300;width:320px;max-height:480px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);flex-direction:column;overflow:hidden">

      <div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px">
        <input id="baron-chat-input" type="text" placeholder="Pergunte ao Barão…" style="flex:1;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:.85rem;outline:none;background:var(--bg)">
        <button onclick="sendBaronMessage()" style="background:var(--primary);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:.9rem;flex-shrink:0"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
    <div id="study-timer-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:400;background:var(--surface);border-radius:var(--radius-lg);padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.2);min-width:300px;text-align:center">
      <img src="/baron-thumbsup-sm.png" id="timer-baron-img" style="width:64px;height:64px;border-radius:50%;margin-bottom:12px" onerror="this.style.display=\'none\'">
      <h2 style="font-family:'Fraunces',serif;font-size:1.4rem;margin-bottom:16px">Sessão de Estudo</h2>

        <select id="timer-subject" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:.95rem;background:var(--bg)">
          <option value="">Selecione…</option>
          <option>Português</option><option>História do Brasil</option><option>História Mundial</option>
          <option>Política Internacional</option><option>Economia</option><option>Direito Internacional</option>
          <option>Direito Interno</option><option>Geografia</option><option>Inglês</option>
          <option>Francês</option><option>Espanhol</option>
        </select>
      </div>

      <div style="display:flex;gap:10px;justify-content:center">
        <button id="timer-start-btn" class="btn btn-primary" onclick="startStudyTimer()"><i class="fas fa-play"></i> Começar</button>
        <button id="timer-stop-btn" class="btn btn-danger" onclick="stopStudyTimer()" style="display:none"><i class="fas fa-stop"></i> Encerrar</button>
        <button class="btn btn-secondary" onclick="closeStudyTimer()">Fechar</button>

    </div>
    <div id="study-timer-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:399" onclick="closeStudyTimer()"></div>

    <script>
    /* ============================================================
       API CLIENT
       ============================================================ */
    var _store = window['local' + 'Storage'];
    var API = {
        getToken: function() { try { return _store.getItem('eduflow_token'); } catch(e) { return null; } },
        setToken: function(t) { try { _store.setItem('eduflow_token', t); } catch(e) { /* noop */ } },
        clearToken: function() { try { _store.removeItem('eduflow_token'); } catch(e) { /* noop */ } },

        request: function(method, url, body) {
            var headers = { 'Content-Type': 'application/json' };
            var token = this.getToken();
            if (token) headers['Authorization'] = 'Bearer ' + token;
            var opts = { method: method, headers: headers };
            if (body) opts.body = JSON.stringify(body);
            return fetch(url, opts).then(function(res) {
                var contentType = res.headers.get('content-type') || '';
                if (contentType.indexOf('application/json') === -1) {
                    return res.text().then(function(text) {
                        throw new Error(res.ok ? text : 'Erro do servidor (HTTP ' + res.status + '): ' + (text || '').substring(0, 120));
                    });
                }
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || 'Erro na requisição');
                    return data;
                });
            });
        },

        login: function(username, password) { return this.request('POST', '/api/auth', { action: 'login', username: username, password: password }); },
        getMe: function() { return this.request('GET', '/api/auth'); },

        getUsers: function() { return this.request('GET', '/api/users'); },
        createUser: function(data) { return this.request('POST', '/api/users', data); },
        updateUser: function(id, data) { return this.request('PUT', '/api/users?id=' + id, data); },
        deleteUser: function(id) { return this.request('DELETE', '/api/users?id=' + id); },

        getSubjects: function() { return this.request('GET', '/api/subjects'); },
        createSubject: function(data) { return this.request('POST', '/api/subjects', data); },
        updateSubject: function(id, data) { return this.request('PUT', '/api/subjects?id=' + id, data); },
        deleteSubject: function(id) { return this.request('DELETE', '/api/subjects?id=' + id); },

        getLessons: function(subjectId) { return this.request('GET', '/api/lessons?subjectId=' + subjectId); },
        createLesson: function(data) { return this.request('POST', '/api/lessons', data); },
        updateLesson: function(id, data) { return this.request('PUT', '/api/lessons?id=' + id, data); },
        deleteLesson: function(id) { return this.request('DELETE', '/api/lessons?id=' + id); },
        reorderLesson: function(lessonId, direction) { return this.request('PUT', '/api/lessons', { lessonId: lessonId, direction: direction }); },

        getProgress: function(lessonId) { return this.request('GET', '/api/progress' + (lessonId ? '?lessonId=' + lessonId : '')); },
        saveProgress: function(data) { return this.request('POST', '/api/progress', data); },

        resetPassword: function(token, username, newPassword) { return this.request('POST', '/api/auth', { action: 'reset', token: token, username: username, newPassword: newPassword }); },

        generateMacroPlan: function(data) { return this.request('POST', '/api/generate-macro-plan', data); },
        getPlansHistory: function() { return this.request('GET', '/api/generate-plan'); },
        generateQuestions: function(data) { return this.request('POST', '/api/generate-questions', data); },
        getQuestions: function(params) {
            var qs = Object.keys(params||{}).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
            return this.request('GET', '/api/questions' + (qs ? '?' + qs : ''));
        },
        createSimulado: function(data) { return this.request('POST', '/api/simulado', Object.assign({action:'create'}, data)); },
        submitSimulado: function(simuladoId, respostas) { return this.request('POST', '/api/simulado', {action:'submit', simuladoId:simuladoId, respostas:respostas}); },
        getSimulados: function(limit) { return this.request('GET', '/api/simulado' + (limit ? '?limit='+limit : '')); }
    };

    /* ============================================================
       LOCAL VISUAL PREVIEW
       ============================================================ */
    function isVisualPreview() {
        try {
            return window.location.protocol === 'file:' || new URLSearchParams(window.location.search).get('preview') === '1';
        } catch(e) {
            return false;
        }
    }

    function enableVisualPreview() {
        var previewUser = { id: 1, name: 'Rafael Ordinani', username: 'rafael', role: 'student' };
        var subjects = [
            {id:1,name:'Português',description:'Gramática, literatura, interpretação e redação.'},
            {id:2,name:'História do Brasil',description:'Do período colonial à política externa brasileira.'},
            {id:3,name:'História Mundial',description:'Processos históricos e relações internacionais.'},
            {id:4,name:'Inglês',description:'Leitura, vocabulário e interpretação diplomática.'},
            {id:5,name:'Francês',description:'Leitura e domínio instrumental.'},
            {id:6,name:'Espanhol',description:'Compreensão e vocabulário de prova.'},
            {id:7,name:'Economia',description:'Micro, macro e economia brasileira.'},
            {id:8,name:'Direito Interno',description:'Constitucional, administrativo e organização do Estado.'},
            {id:9,name:'Geografia',description:'Geopolítica, território, ambiente e urbanização.'},
            {id:10,name:'Direito Internacional',description:'Tratados, organizações e prática diplomática.'},
            {id:11,name:'Política Internacional',description:'Teoria, organismos, integração e conflitos.'}
        ];
        var counts = {1:48,2:120,3:26,4:24,5:24,6:24,7:30,8:16,9:30,10:24,11:34};
        var complete = {1:0,2:1,3:1,4:0,5:0,6:0,7:0,8:0,9:0,10:0,11:0};
        var lessonsBySubject = {};
        var progress = [];
        subjects.forEach(function(s) {
            var total = counts[s.id] || 12;
            lessonsBySubject[s.id] = Array.from({length: total}, function(_, i) {
                return { id: s.id * 1000 + i + 1, subject_id: s.id, title: i === 0 ? 'Ciclo do Ouro e Reformas Pombalinas' : 'Aula ' + (i + 1), duration_minutes: 45, order_index: i + 1 };
            });
            for (var i = 0; i < (complete[s.id] || 0); i++) {
                progress.push({ lesson_id: s.id * 1000 + i + 1, current_time_seconds: 1200, completed: true, last_accessed: '2026-06-16' });
            }
        });
        var macroPlan = {
            resumo:'Este Plano Mestre de 60 semanas para o CACD prioriza as matérias mais relevantes, começando com História do Brasil, História Mundial e Português. O cronograma equilibra estudo aprofundado com revisões periódicas e simulados.',
            totalSemanas:60,totalHoras:600,
            semanas:[
                {semana:1,dataInicio:'2026-06-06',dataFim:'2026-06-12',materias:[
                    {id:'w1-1',tipo:'estudo',nome:'História do Brasil',topico:'Formação territorial do Brasil',atividades:[{tipo:'leitura',descricao:'Leitura e fichamento',horas:3}],done:true}
                ]},
                {semana:2,dataInicio:'2026-06-13',dataFim:'2026-06-19',materias:[
                    {id:'w2-1',subject_id:2,tipo:'estudo',nome:'História do Brasil',topico:'Ciclo do Ouro e Reformas Pombalinas',atividades:[{tipo:'leitura',descricao:'Leitura e fichamento sobre o período',horas:3},{tipo:'tps',descricao:'Resolução de questões TPS sobre o tema',horas:1}],done:false},
                    {id:'w2-2',subject_id:3,tipo:'estudo',nome:'História Mundial',topico:'Iluminismo e Revolução Francesa',atividades:[{tipo:'leitura',descricao:'Leitura dirigida e mapa mental',horas:3}],done:false},
                    {id:'w2-3',subject_id:1,tipo:'estudo',nome:'Português',topico:'Coesão, Coerência e Figuras de Linguagem',atividades:[{tipo:'exercícios',descricao:'Prática orientada e revisão',horas:2}],done:false}
                ]}
            ]
        };
        var todayPlan = {
            plan_date:'2026-06-16',hours_available:3,focus_subjects:'História do Brasil, História Mundial, Português',
            plan_json:{saudacao:'Bom estudo. Hoje o foco é avançar com serenidade.',resumoDia:'Três blocos objetivos para consolidar a semana do Plano Mestre.',totalHorasEstudo:3,blocos:[
                {horario:'08:00 - 09:00',duracaoMin:60,titulo:'História do Brasil',descricao:'Ciclo do Ouro e Reformas Pombalinas',materia:'História do Brasil',tipo:'Estudo'},
                {horario:'09:15 - 10:15',duracaoMin:60,titulo:'História Mundial',descricao:'Iluminismo e Revolução Francesa',materia:'História Mundial',tipo:'Estudo'},
                {horario:'10:30 - 11:30',duracaoMin:60,titulo:'Português',descricao:'Coesão, coerência e figuras de linguagem',materia:'Português',tipo:'Estudo'}
            ],dicaDoDia:'Finalize cada bloco anotando uma pergunta que você ainda não sabe responder.'}
        };
        var performance = {
            overall:{total:4,correct:1,accuracy:25,subjects_with_data:1},
            subjects:[{subject:'História do Brasil',accuracy:25,correct:1,total:4},{subject:'Português',accuracy:62,correct:5,total:8},{subject:'História Mundial',accuracy:48,correct:6,total:12}],
            weakSubjects:[{subject:'História do Brasil',accuracy:25,correct:1,total:4}],
            weakTopics:[{subject:'História do Brasil',topic:'M1A1 - PERÍODO COLONIAL',accuracy:25,correct:1,total:4}]
        };
        function delayed(data) { return Promise.resolve(JSON.parse(JSON.stringify(data))); }
        API.getToken = function() { return 'preview-token'; };
        API.setToken = function() {};
        API.clearToken = function() {};
        API.login = function() { return delayed({ token:'preview-token', user:previewUser }); };
        API.getMe = function() { return delayed({ user:previewUser }); };
        API.getSubjects = function() { return delayed(subjects); };
        API.getLessons = function(subjectId) { return delayed(lessonsBySubject[subjectId] || []); };
        API.getProgress = function(lessonId) {
            if (!lessonId) return delayed(progress);
            return delayed(progress.filter(function(p) { return p.lesson_id === lessonId; }));
        };
        API.getPlansHistory = function() { return delayed([todayPlan]); };
        API.generateMacroPlan = function() { return delayed(macroPlan); };
        API.generateQuestions = function() { return delayed({ questoes: [] }); };
        API.createSimulado = function() { return delayed({ simuladoId:1, questoes: [] }); };
        API.submitSimulado = function() { return delayed({ score:0,total:1,questoes_with_gabarito:[],subject_stats:{} }); };
        API.request = function(method, url, body) {
            if (url.indexOf('/api/generate-macro-plan') === 0) return delayed({ created_at:'2026-06-06T12:00:00Z', data_prova:'2027-08-06', plan_json:macroPlan });
            if (url.indexOf('/api/generate-plan') === 0 && method === 'GET') return delayed([todayPlan]);
            if (url.indexOf('/api/generate-plan') === 0 && method === 'POST') return delayed(todayPlan.plan_json);
            if (url.indexOf('/api/performance?action=macro') === 0) return delayed({ data_prova:'2027-08-06' });
            if (url.indexOf('/api/performance?action=study') === 0) return delayed([{subject:'História do Brasil',duration_minutes:70,started_at:'2026-06-16T12:00:00Z'},{subject:'Português',duration_minutes:45,started_at:'2026-06-15T12:00:00Z'}]);
            if (url.indexOf('/api/performance') === 0) return delayed(performance);
            if (url.indexOf('/api/baron-chat') === 0) return delayed({ reply:'Modo preview ativo. Navegue livremente para revisar o visual.' });
            return delayed({});
        };
        function rewriteLocalAssets() {
            document.querySelectorAll('img[src^="/"]').forEach(function(img) {
                img.setAttribute('src', img.getAttribute('src').replace(/^\//, ''));
            });
        }
        var observer = new MutationObserver(function() {
            rewriteLocalAssets();
        });
        observer.observe(document.documentElement, { childList:true, subtree:true });
        rewriteLocalAssets();
    }
    if (isVisualPreview()) enableVisualPreview();

    /* ============================================================
       STATE
       ============================================================ */
    var state = { view: 'login', user: null, selectedSubjectId: null, selectedLessonId: null, resetToken: null };

    /* ============================================================
       UTILITIES
       ============================================================ */
    function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

    // Renders enunciado separating context text (before |) from item text (after |)
    function renderEnunciado(enunciado) {
        if (!enunciado) return '';
        var parts = enunciado.split(' | ');
        if (parts.length === 1) return '<p style="font-size:.9rem;line-height:1.6;margin:0">' + escapeHtml(enunciado) + '</p>';
        var context = parts.slice(0, parts.length - 1).join(' | ');
        var item = parts[parts.length - 1];
        return '<blockquote style="margin:0 0 10px 0;padding:10px 14px;background:var(--surface-hover);border-left:3px solid var(--primary);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.85rem;line-height:1.6;color:var(--text-secondary);font-style:italic">' + escapeHtml(context) + '</blockquote>' +

    function toggleBaronChat() {

    function loadBaronHistory() {
        // Messages are already stored in _baronMessages; re-render if container is empty
        var msgs = document.getElementById('baron-chat-messages');
        if (!msgs) return;
        if (msgs.children.length === 0 && _baronMessages.length === 0) {
            // Show welcome message on first open

        }
    }

    function appendBaronMessage(role, text) {
        _baronMessages.push({role: role, text: text});
        var msgs = document.getElementById('baron-chat-messages');
        if (!msgs) return;
        var isUser = role === 'user';
        var div = document.createElement('div');
        div.style.cssText = 'display:flex;gap:8px;align-items:flex-end;' + (isUser ? 'flex-direction:row-reverse' : '');
        div.innerHTML = (isUser ? '' : '<img src="/baron-neutral-sm.png" style="width:28px;height:28px;border-radius:50%;flex-shrink:0" onerror="this.style.display=\'none\'">') +
            '<div style="max-width:80%;padding:8px 12px;border-radius:' + (isUser ? '12px 12px 4px 12px' : '12px 12px 12px 4px') + ';background:' + (isUser ? 'var(--primary)' : 'var(--primary-light)') + ';color:' + (isUser ? '#fff' : 'var(--text)') + ';font-size:.83rem;line-height:1.5">' + escapeHtml(text) + '</div>';
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function sendBaronMessage() {
        var input = document.getElementById('baron-chat-input');
        var text = (input ? input.value : '').trim();
        if (!text) return;
        input.value = '';
        appendBaronMessage('user', text);
        // Show typing indicator
        var msgs = document.getElementById('baron-chat-messages');
        var typing = document.createElement('div');
        typing.id = 'baron-typing';
        typing.style.cssText = 'display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--text-muted)';
        typing.innerHTML = '<img src="/baron-reading-sm.png" style="width:24px;height:24px;border-radius:50%" onerror="this.style.display=\'none\'"><span>Barão está digitando…</span>';
        if (msgs) msgs.appendChild(typing);

        API.request('POST', '/api/baron-chat', { message: text }).then(function(data) {
            var t = document.getElementById('baron-typing');
            if (t) t.remove();
            appendBaronMessage('assistant', data.reply || '');
            baronFloatPose('pointing', 3000);
        }).catch(function() {
            var t = document.getElementById('baron-typing');
            if (t) t.remove();
            appendBaronMessage('assistant', 'Desculpe, tive um problema. Tente novamente.');
        });

    var _studyTimerInterval = null;
    var _studyTimerStart = null;
    var _studyTimerSubject = null;

    function openStudyTimer() {
        document.getElementById('study-timer-modal').style.display = 'block';
        document.getElementById('study-timer-overlay').style.display = 'block';
    }

    function closeStudyTimer() {
        if (_studyTimerInterval) { if (!confirm('O cronômetro está rodando. Encerrar a sessão?')) return; stopStudyTimer(); }
        document.getElementById('study-timer-modal').style.display = 'none';
        document.getElementById('study-timer-overlay').style.display = 'none';
    }

    function startStudyTimer() {
        var subject = document.getElementById('timer-subject').value;
        if (!subject) { showToast('Selecione uma matéria', 'error'); return; }
        _studyTimerSubject = subject;
        _studyTimerStart = new Date();
        document.getElementById('timer-subject-select').style.display = 'none';
        document.getElementById('timer-display').style.display = 'block';
        document.getElementById('timer-start-btn').style.display = 'none';
        document.getElementById('timer-stop-btn').style.display = 'inline-flex';
        document.getElementById('timer-baron-img').src = '/baron-reading-sm.png';
        _studyTimerInterval = setInterval(function() {
            var elapsed = Math.floor((new Date() - _studyTimerStart) / 1000);
            var h = Math.floor(elapsed/3600), m = Math.floor((elapsed%3600)/60), s = elapsed%60;
            document.getElementById('timer-display').textContent =
                String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }, 1000);
        baronFloatPose('reading', 99999);
    }

    function stopStudyTimer() {
        if (!_studyTimerInterval) return;
        clearInterval(_studyTimerInterval);
        _studyTimerInterval = null;
        var durationMs = new Date() - _studyTimerStart;
        var durationMin = Math.max(1, Math.round(durationMs / 60000));
        // Save session
        API.request('POST', '/api/performance', {
            subject: _studyTimerSubject,
            durationMinutes: durationMin,
            startedAt: _studyTimerStart.toISOString()
        }).catch(function(){});
        showToast('Sessão de ' + durationMin + ' min de ' + _studyTimerSubject + ' registrada!', 'success');
        baronFloatPose('thumbsup', 4000);
        baronShowSpeech('Ótima sessão! ' + durationMin + ' min de ' + _studyTimerSubject + ' registrados.');
        // Reset timer UI
        document.getElementById('study-timer-modal').style.display = 'none';
        document.getElementById('study-timer-overlay').style.display = 'none';
        document.getElementById('timer-subject-select').style.display = 'block';
        document.getElementById('timer-display').style.display = 'none';
        document.getElementById('timer-start-btn').style.display = 'inline-flex';
        document.getElementById('timer-stop-btn').style.display = 'none';
        document.getElementById('timer-subject').value = '';
        document.getElementById('timer-display').textContent = '00:00:00';
        document.getElementById('timer-baron-img').src = '/baron-thumbsup-sm.png';
        _studyTimerStart = null;
        _studyTimerSubject = null;
    }

    /* Toast */
    function showToast(msg, type) {
        type = type || 'success';
        var icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
        var t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.innerHTML = '<i class="fas ' + (icons[type]||icons.info) + '"></i> ' + escapeHtml(msg);
        document.getElementById('toast-container').appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2500);

    /* Confirm Modal */
    function showConfirmModal(title, msg, confirmText, cls, onConfirm) {
        var o = document.createElement('div'); o.className = 'modal-overlay';
        o.innerHTML = '<div class="modal"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(msg)+'</p><div class="modal-actions"><button class="btn btn-secondary cancel-btn">Cancelar</button><button class="btn '+(cls||'btn-danger')+' confirm-btn">'+escapeHtml(confirmText)+'</button></div></div>';
        o.querySelector('.cancel-btn').addEventListener('click', function() { o.remove(); });
        o.querySelector('.confirm-btn').addEventListener('click', function() { onConfirm(); o.remove(); });
        o.addEventListener('click', function(e) { if (e.target === o) o.remove(); });
        document.body.appendChild(o);
    }

    /* Form Modal */
    function showFormModal(title, fields, submitText, onSubmit) {
        var o = document.createElement('div'); o.className = 'modal-overlay';
        var fh = fields.map(function(f) {
            var ih = '';
            if (f.type === 'textarea') ih = '<textarea id="modal-'+f.name+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(f.value||'')+'</textarea>';
            else if (f.type === 'select') { ih = '<select id="modal-'+f.name+'">' + f.options.map(function(op) { return '<option value="'+escapeHtml(op.value)+'"'+(op.value===f.value?' selected':'')+'>'+escapeHtml(op.label)+'</option>'; }).join('') + '</select>'; }
            else ih = '<input type="'+(f.type||'text')+'" id="modal-'+f.name+'" value="'+escapeHtml(f.value||'')+'" placeholder="'+escapeHtml(f.placeholder||'')+'"'+(f.required?' required':'')+'>';
            return '<div class="form-group"><label>'+escapeHtml(f.label)+'</label>'+ih+'</div>';
        }).join('');
        o.innerHTML = '<div class="modal"><h3>'+escapeHtml(title)+'</h3><form id="modal-form">'+fh+'<div class="modal-actions"><button type="button" class="btn btn-secondary cancel-btn">Cancelar</button><button type="submit" class="btn btn-primary">'+escapeHtml(submitText)+'</button></div></form></div>';
        o.querySelector('.cancel-btn').addEventListener('click', function() { o.remove(); });
        o.querySelector('#modal-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var v = {}; fields.forEach(function(f) { v[f.name] = document.getElementById('modal-'+f.name).value; });
            onSubmit(v); o.remove();
        });
        o.addEventListener('click', function(e) { if (e.target === o) o.remove(); });
        document.body.appendChild(o);
    }

        state.view = view;
        if (params) {

    function renderMasterWeekPanel(macro) {
        var panel = document.getElementById('master-week-panel');
        if (!panel) return;
        if (!macro || !macro.plan_json) {
            panel.innerHTML = '<div style="background:var(--surface-hover);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;font-size:.85rem;color:var(--text-muted)">' +
                '<i class="fas fa-road" style="margin-right:6px"></i> Você ainda não tem um Plano Mestre. ' +
                '<a onclick="navigate(\'student-macro-planner\')" style="cursor:pointer;color:var(--primary);font-weight:600">Criar agora →</a>' +
            '</div>';
            return;
        }
        var today = new Date().toISOString().split('T')[0];
        var semanas = macro.plan_json.semanas || [];
        var currentWeek = semanas.find(function(s) { return s.dataInicio && s.dataFim && today >= s.dataInicio && today <= s.dataFim; });
        if (!currentWeek) {
            // Find the next upcoming week
            currentWeek = semanas.find(function(s) { return s.dataInicio && today < s.dataInicio; });
        }
        if (!currentWeek) { panel.innerHTML = ''; return; }

        var materias = currentWeek.materias || [];
        var pendingStudy = materias.filter(function(m) { return m.tipo === 'estudo' && !m.done; });
        var pendingReview = materias.filter(function(m) { return m.tipo === 'revisao' && !m.done; });
        var doneCount = materias.filter(function(m) { return m.done; }).length;

        var itemsHtml = materias.map(function(m) {
            var isRev = m.tipo === 'revisao';
            var isDone = !!m.done;
            var checkClass = isDone ? (isRev ? 'checked-rev' : 'checked') : '';
            var checkIcon = isDone ? '<i class="fas fa-check"></i>' : '';
            var mId = m.id || '';
            var actBtns = '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">' +
                '<button class="macro-link-btn lesson" style="font-size:.72rem;padding:3px 8px" onclick="abrirAulasPlano(' + _jsNull(m.subject_id) + ',' + _js(m.nome || '') + ',' + _jsNull(m.topico) + ')">' +
                    '<i class="fas fa-play-circle"></i> Ver aulas</button>' +
                '<button class="macro-link-btn exercise" style="font-size:.72rem;padding:3px 8px" onclick="abrirRevisaoPlano(' + _js(m.nome || '') + ')">' +
                    '<i class="fas fa-question-circle"></i> ' + (isRev ? 'Fazer exercícios' : 'Praticar questões') + '</button>' +
            '</div>';
            return '<div id="mitem-' + escapeHtml(mId) + '" class="card planner-task tipo-' + (isRev ? 'revisao' : 'estudo') + (isDone ? ' done-item' : '') + '">' +
                '<div class="macro-check ' + checkClass + '" onclick="toggleMacraItem(' + _js(mId) + ',' + !isDone + ')" title="Marcar como ' + (isDone ? 'pendente' : 'concluído') + '">' + checkIcon + '</div>' +
                '<div style="min-width:0">' +
                  '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px"><span class="macro-badge ' + (isRev ? 'revisao' : 'estudo') + '">' + (isRev ? 'Revisão' : 'Estudo') + '</span><h3 style="font-size:1.35rem;margin:0' + (isDone ? ';text-decoration:line-through;color:var(--text-muted)' : '') + '">' + escapeHtml(m.nome) + '</h3></div>' +
                  '<div style="font-size:.92rem;color:var(--text-secondary)">' + escapeHtml(m.topico || '') + '</div>' +
                '</div>' +
                '<div class="planner-actions">' + (!isDone ? actBtns : '') + '</div>' +
                '<button class="btn btn-secondary btn-sm" style="width:40px;height:40px;padding:0;justify-content:center" title="Expandir"><i class="fas fa-chevron-down"></i></button>' +
            '</div>';
        }).join('');

        var pct = materias.length > 0 ? Math.round(doneCount / materias.length * 100) : 0;
        var provaDate = macro.data_prova ? new Date(macro.data_prova + 'T12:00:00') : null;
        var daysLeft = provaDate ? Math.max(0, Math.ceil((provaDate - new Date()) / 86400000)) : null;

        panel.innerHTML =
            '<div class="card" style="margin-bottom:20px;padding:26px 28px">' +
              '<div style="display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px">' +
                '<div style="display:flex;align-items:center;gap:18px">' +
                  '<div class="subject-icon"><i class="fas fa-calendar-plus"></i></div><div>' +
                  '<h2 style="font-size:1.55rem;margin:0">Plano Mestre — Semana ' + (currentWeek.semana || '') + '</h2>' +
                  '<div style="font-size:.9rem;color:var(--text-secondary);margin-top:4px">' +
                    (currentWeek.dataInicio ? escapeHtml(currentWeek.dataInicio) + ' a ' + escapeHtml(currentWeek.dataFim) : '') +
                    (daysLeft !== null ? ' · ' + daysLeft + ' dias para a prova' : '') +
                  '</div>' +
                '</div></div>' +
                '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div><div style="font-size:1.35rem;font-weight:800;color:var(--primary)">' + doneCount + '/' + materias.length + '</div><div style="font-size:.82rem;color:var(--text-secondary)">concluídos</div></div><div style="width:220px;max-width:40vw"><div class="card-progress-bar"><div class="fill" style="width:' + pct + '%"></div></div><div style="font-size:.78rem;color:var(--text-muted);margin-top:4px;text-align:right">' + pct + '%</div></div><a onclick="navigate(\'student-macro-planner\')" style="cursor:pointer;color:var(--primary);font-weight:700">Ver plano completo <i class="fas fa-arrow-right"></i></a></div>' +
              '</div>' +
            '</div>' +
              '<div style="display:flex;flex-direction:column;gap:10px">' +
                itemsHtml +
                (pendingStudy.length === 0 && pendingReview.length === 0 ? '<div style="padding:12px 0;font-size:.85rem;color:var(--success);font-weight:600"><i class="fas fa-check-circle"></i> Semana concluída! Excelente trabalho.</div>' : '') +
              '</div>' +
              '<div style="padding:18px 10px;font-size:.9rem;color:var(--text-secondary)">' +
                '<i class="fas fa-magic" style="color:var(--accent);margin-right:5px"></i>' +
                'O plano de hoje será gerado levando em conta os itens pendentes desta semana.' +
              '</div>';
    }

    function renderPlansHistory(plans) {
            var section = document.getElementById('history-section');
            var list = document.getElementById('history-list');
            if (!section || !list) return;
            if (!plans || plans.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            // Check if today's plan already exists and show it
            var today = new Date().toISOString().split('T')[0];
            var todayPlan = plans.find(function(p) { return p.plan_date === today; });
            if (todayPlan) {
                var out = document.getElementById('plan-output');
                if (out && out.style.display === 'none') {

    function renderPlanoInline(plan) {

            var tags = '';

    function gerarPlano() {
        var hours = parseFloat(document.getElementById('planner-hours').value) || 3;

    function getReadingKey(userId, lessonId, idx) { return 'reading_' + userId + '_' + lessonId + '_' + idx; }

    function renderReadingsSection(subjectName, lessonId) {
        var readings = LESSON_READINGS[subjectName];
        if (!readings) return '';
        // Support both old flat array and new {fundamental, complementar} structure
        var fundamental = Array.isArray(readings) ? readings : (readings.fundamental || []);
        var complementar = Array.isArray(readings) ? [] : (readings.complementar || []);
        var all = fundamental.concat(complementar);
        if (all.length === 0) return '';
        var userId = state.user ? state.user.id : 'anon';
        var done = 0;
        all.forEach(function(r, i) {
            try { if (_store.getItem(getReadingKey(userId, lessonId, i)) === '1') done++; } catch(e) {}
        });
        function buildItems(list, offset) {
            return list.map(function(r, i) {
                var idx = offset + i;
                var checked = false;
                try { checked = _store.getItem(getReadingKey(userId, lessonId, idx)) === '1'; } catch(e) {}
                return '<div class="reading-item' + (checked ? ' done' : '') + '" id="ri-' + idx + '">' +
                    '<input type="checkbox" id="rc-' + idx + '" ' + (checked ? 'checked' : '') + ' onchange="toggleReading(' + lessonId + ',' + idx + ',this.checked)">' +
                    '<label for="rc-' + idx + '">' + escapeHtml(r) + '</label>' +
                '</div>';
            }).join('');
        }
        var funHtml = fundamental.length > 0
            ? '<div style="margin-bottom:12px"><div style="font-size:.8rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px"><i class="fas fa-star" style="margin-right:4px"></i>Leituras Fundamentais</div>' + buildItems(fundamental, 0) + '</div>'
            : '';
        var compHtml = complementar.length > 0
            ? '<div><div style="font-size:.8rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px"><i class="fas fa-plus-circle" style="margin-right:4px"></i>Leituras Complementares</div>' + buildItems(complementar, fundamental.length) + '</div>'
            : '';
        return '<div class="readings-section">' +
            '<h3><i class="fas fa-book-open"></i> Leituras Recomendadas — ' + escapeHtml(subjectName) + '</h3>' +
            '<div class="reading-progress" id="reading-progress-' + lessonId + '">' + done + '/' + all.length + ' leituras feitas</div>' +
            funHtml + compHtml +
        '</div>';
    }

        var item = document.getElementById('ri-' + idx);
        if (item) item.classList.toggle('done', checked);
        // Update counter
        var subjectName = null;
        Object.keys(LESSON_READINGS).forEach(function(k) {
            // find the currently rendered subject by checking rendered items
        });
        var total = 0, done = 0;

    var _currentLesson = '';

    function gerarQuestoes(lessonId, subjectName, lessonTitle) {
        _currentSubject = subjectName || '';
        _currentLesson = lessonTitle || '';
        var btn = document.getElementById('gen-questions-btn');
        var out = document.getElementById('questions-output');
        if (btn) { btn.disabled = true; btn.innerHTML = '<img src="/baron-reading-sm.png" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:6px" onerror="this.outerHTML=\'<i class=\\\"fas fa-spinner fa-spin\\\"></i>\'"> Gerando questões…'; }

        out.innerHTML = '';

        API.generateQuestions({ lessonId: lessonId, subjectName: subjectName, lessonTitle: lessonTitle, count: 5 }).then(function(data) {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync"></i> Regerar Questões'; }

            appendMaisQuestoesBtn(out, lessonId, subjectName, lessonTitle, questoes.length);
        }).catch(function(err) {
